name: 编译 Rockchip 刷机包 (RK3188 三发行版)

on:
  workflow_dispatch:
    inputs:
      device_model:
        description: '设备型号'
        required: true
        type: choice
        options: [rk3188, rk3288]
        default: 'rk3188'
      board:
        description: '板型（对应 dts 文件名，不含 .dts）'
        required: true
        default: 'rk3188-adesk-std'
      kernel_version:
        description: '内核版本'
        required: true
        default: '6.12.116'
      distros:
        description: '要构建的发行版（逗号分隔：ubuntu,debian,armbian）'
        required: true
        default: 'ubuntu,debian,armbian'
      ubuntu_version:
        description: 'Ubuntu Base 版本'
        required: false
        type: choice
        options: ['20.04.5', '22.04.5', '24.04.5']
        default: '22.04.5'
      debian_suite:
        description: 'Debian 代号'
        required: false
        type: choice
        options: ['bookworm', 'trixie']
        default: 'bookworm'
      armbian_board:
        description: 'Armbian 板型'
        required: false
        default: 'rock-5b'
      armbian_release:
        description: 'Armbian 发行代号（rock-5b 只有 trixie/resolute）'
        required: false
        type: choice
        options: ['trixie', 'resolute', 'bookworm']
        default: 'trixie'
      armbian_branch:
        description: 'Armbian 分支'
        required: false
        type: choice
        options: ['current', 'edge', 'vendor', 'legacy']
        default: 'legacy'
      base_url:
        description: 'Ubuntu Base 下载根前缀（留空则自动用 codename 拼完整）'
        required: false
        default: ''
      mirror:
        description: 'apt 软件源镜像（Ubuntu）'
        required: false
        default: 'http://repo.huaweicloud.com/ubuntu-ports'
      debian_mirror:
        description: 'Debian 软件源镜像'
        required: false
        default: 'https://mirrors.aliyun.com/debian'
      root_password:
        description: 'root 登录密码'
        required: false
        default: 'root123'
      custom_mac:
        description: '自定义 eth0 MAC（留空用原生）'
        required: false
        default: ''
      minimal_mode:
        description: 'C 级精简（yes = 移除 htop/bash-completion/rsyslog）'
        required: false
        type: choice
        options: ['no', 'yes']
        default: 'no'
      rootfs_size:
        description: 'rootfs.img 最小大小'
        required: true
        default: '2G'

permissions:
  contents: write

jobs:
  # ============================================================
  # 准备矩阵：把 inputs.distros 拆成矩阵
  # 关键：Ubuntu 的 codename 必须是代号（jammy/focal/noble），不能是版本号
  # ============================================================
  prepare-matrix:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          set -euo pipefail

          # Ubuntu 版本 → 代号
          UV="${{ inputs.ubuntu_version }}"
          case "$UV" in
            20.04.*) UCODENAME="focal" ;;
            22.04.*) UCODENAME="jammy" ;;
            24.04.*) UCODENAME="noble" ;;
            *)       UCODENAME="jammy" ;;
          esac

          DISTROS="${{ inputs.distros }}"
          MATRIX="[]"
          IFS=',' read -ra ARR <<< "$DISTROS"
          for d in "${ARR[@]}"; do
            d=$(echo "$d" | xargs)
            case "$d" in
              ubuntu)
                MATRIX=$(echo "$MATRIX" | jq -c --arg c "$UCODENAME" \
                  '. + [{
                    "distro":"ubuntu",
                    "codename":$c,
                    "debian_suite":"bookworm",
                    "armbian_board":"rock-5b",
                    "armbian_release":"bookworm",
                    "armbian_branch":"legacy"
                  }]')
                ;;
              debian)
                MATRIX=$(echo "$MATRIX" | jq -c --arg c "${{ inputs.debian_suite }}" \
                  '. + [{
                    "distro":"debian",
                    "codename":$c,
                    "debian_suite":$c,
                    "armbian_board":"rock-5b",
                    "armbian_release":"bookworm",
                    "armbian_branch":"legacy"
                  }]')
                ;;
              armbian)
                MATRIX=$(echo "$MATRIX" | jq -c \
                  --arg board "${{ inputs.armbian_board }}" \
                  --arg release "${{ inputs.armbian_release }}" \
                  --arg branch "${{ inputs.armbian_branch }}" \
                  '. + [{
                    "distro":"armbian",
                    "codename":$release,
                    "debian_suite":"bookworm",
                    "armbian_board":$board,
                    "armbian_release":$release,
                    "armbian_branch":$branch
                  }]')
                ;;
              *) echo "⚠️ 未知 distro: $d";;
            esac
          done
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"
          echo "矩阵: $MATRIX"

  # ============================================================
  # 构建矩阵
  # ============================================================
  build-rockchip:
    needs: prepare-matrix
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    strategy:
      matrix:
        include: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
      fail-fast: false

    env:
      DEVICE_MODEL: ${{ inputs.device_model }}
      BOARD: ${{ inputs.board }}
      KERNEL_VERSION: ${{ inputs.kernel_version }}
      DISTRO: ${{ matrix.distro }}
      CODENAME: ${{ matrix.codename }}
      DEBIAN_SUITE: ${{ matrix.debian_suite }}
      ARMBIAN_BOARD: ${{ matrix.armbian_board }}
      ARMBIAN_RELEASE: ${{ matrix.armbian_release }}
      ARMBIAN_BRANCH: ${{ matrix.armbian_branch }}
      BASE_URL: ${{ inputs.base_url }}
      MIRROR: ${{ inputs.mirror }}
      DEBIAN_MIRROR: ${{ inputs.debian_mirror }}
      ROOT_PASSWORD: ${{ inputs.root_password }}
      CUSTOM_MAC: ${{ inputs.custom_mac }}
      MINIMAL_MODE: ${{ inputs.minimal_mode }}
      ROOTFS_SIZE: ${{ inputs.rootfs_size }}

    steps:
    - name: 1. 检出代码
      uses: actions/checkout@v4

    # ============================================================
    # 步骤 2：解析架构与 UBUNTU_ARCH（本地赋值 + GITHUB_ENV 双保险）
    # ============================================================
    - name: 2. 解析架构与工具链
      run: |
        set -euo pipefail

        ARCH=""
        CROSS_COMPILE=""
        KERNEL_IMAGE=""
        UBUNTU_ARCH=""
        QEMU_STATIC=""

        case "${DEVICE_MODEL}" in
          rk3188|rk3288)
            ARCH="arm"
            CROSS_COMPILE="arm-linux-gnueabihf-"
            KERNEL_IMAGE="zImage"
            UBUNTU_ARCH="armhf"
            QEMU_STATIC="qemu-arm-static"
            ;;
          *)
            ARCH="arm64"
            CROSS_COMPILE="aarch64-linux-gnu-"
            KERNEL_IMAGE="Image"
            UBUNTU_ARCH="arm64"
            QEMU_STATIC="qemu-aarch64-static"
            ;;
        esac

        {
          echo "ARCH=${ARCH}"
          echo "CROSS_COMPILE=${CROSS_COMPILE}"
          echo "KERNEL_IMAGE=${KERNEL_IMAGE}"
          echo "UBUNTU_ARCH=${UBUNTU_ARCH}"
          echo "QEMU_STATIC=${QEMU_STATIC}"
        } >> "$GITHUB_ENV"

        echo "✅ DISTRO=${DISTRO} ARCH=${ARCH} UBUNTU_ARCH=${UBUNTU_ARCH} CODENAME=${CODENAME}"

    # ============================================================
    # 步骤 3：安装依赖
    #   - debian-archive-keyring：修 Debian NO_PUBKEY
    #   - mmdebstrap / binfmt-support：Debian 构建
    #   - jq：矩阵生成
    # ============================================================
    - name: 3. 安装编译与打包依赖
      run: |
        set -euo pipefail
        sudo apt-get update -qq
        sudo apt-get install -y -qq \
          build-essential flex bison libssl-dev libelf-dev bc rsync \
          qemu-user-static e2fsprogs zip xz-utils kpartx android-sdk-libsparse-utils \
          gcc-arm-linux-gnueabihf libc6-i386 device-tree-compiler \
          mmdebstrap binfmt-support jq \
          debian-archive-keyring

    # ============================================================
    # 步骤 4：缓存 rootfs
    # ============================================================
    - name: 4. 缓存 rootfs
      uses: actions/cache@v4
      with:
        path: cache/*
        key: rootfs-${{ matrix.distro }}-${{ matrix.codename }}-${{ env.UBUNTU_ARCH }}
        restore-keys: |
          rootfs-${{ matrix.distro }}-${{ matrix.codename }}-
          rootfs-${{ matrix.distro }}-

    # ============================================================
    # 步骤 5：构建纯净 rootfs
    #   - BASE_URL 留空时由 common.sh 用 CODENAME 拼完整路径
    #   - UBUNTU_CODENAME 必须是代号（jammy/focal/noble）
    # ============================================================
    - name: 5. 构建纯净 rootfs
      run: |
        set -euo pipefail
        export MODE=usb
        export ROOTFS_DIR="$PWD/usb_pure_rootfs"
        export TARGET_HOSTNAME="${DEVICE_MODEL}"
        export DISTRO="${DISTRO}"
        export UBUNTU_VERSION="${CODENAME}"
        export UBUNTU_ARCH="${UBUNTU_ARCH}"
        export UBUNTU_CODENAME="${CODENAME}"
        export DEBIAN_SUITE="${DEBIAN_SUITE}"
        export DEBIAN_MIRROR="${DEBIAN_MIRROR}"
        export DEBIAN_ARCH="${UBUNTU_ARCH}"
        export ARMBIAN_BOARD="${ARMBIAN_BOARD}"
        export ARMBIAN_RELEASE="${ARMBIAN_RELEASE}"
        export ARMBIAN_BRANCH="${ARMBIAN_BRANCH}"
        export MIRROR="${MIRROR}"
        export MINIMAL_MODE="${MINIMAL_MODE}"
        export ROOT_PASSWORD="${ROOT_PASSWORD}"
        export CUSTOM_MAC="${CUSTOM_MAC}"

        # BASE_URL 仅在用户显式传入时才导出；否则 common.sh 自动拼
        if [ -n "${BASE_URL:-}" ]; then
          export BASE_URL
        fi

        chmod +x build_rootfs.sh lib/*.sh
        sudo -E ./build_rootfs.sh

    # ============================================================
    # 步骤 6：编译内核 / DTB / 模块
    # ============================================================
    - name: 6. 编译内核、DTS 与模块
      run: |
        set -euo pipefail
        KERNEL_MAJOR=$(echo "${KERNEL_VERSION}" | cut -d. -f1)
        KERNEL_TARBALL="linux-${KERNEL_VERSION}.tar.xz"
        wget -q --show-progress "https://cdn.kernel.org/pub/linux/kernel/v${KERNEL_MAJOR}.x/${KERNEL_TARBALL}" -O "${KERNEL_TARBALL}"
        tar xf "${KERNEL_TARBALL}"
        cd "linux-${KERNEL_VERSION}"

        cp "$GITHUB_WORKSPACE/configs/rk3188_defconfig" "arch/${ARCH}/configs/rk3188_defconfig"
        make ARCH="${ARCH}" CROSS_COMPILE="${CROSS_COMPILE}" rk3188_defconfig

        # ========================================================
        # 【修改点 C1】内核配置：命令行分区解析器必须真的编进内核
        #
        # 依据（6.12.116 源码，block/partitions/Kconfig）：
        #   config PARTITION_ADVANCED
        #       bool "Advanced partition selection"
        #   config CMDLINE_PARTITION
        #       bool "Command line partition support" if PARTITION_ADVANCED
        #       help  "Say Y here if you want to read the partition table from bootargs."
        #   config OF_PARTITION
        #       bool "Device Tree partition support" if PARTITION_ADVANCED
        # 且 block/partitions/Makefile 里只有 obj-$(CONFIG_CMDLINE_PARTITION) += cmdline.o。
        #
        # 参考配置 config-5.10.27-rk3188 第 728 行是
        #   "# CONFIG_PARTITION_ADVANCED is not set"
        # 它里面的老符号 CONFIG_BLK_CMDLINE_PARSER=y（5.10 叫 blkdevparts 的开关，
        # 见 block/partitions/cmdline.c 的 __setup("blkdevparts=")）在 6.12 里已经
        # 改名成 CONFIG_CMDLINE_PARTITION，olddefconfig 不会自动帮你迁移，
        # 必须显式打开 —— 这就是 eMMC 上"没有 MBR 也没有分区"的根因所在。
        # ========================================================
        for sym in \
          CONFIG_OF_EARLY_FLATTREE CONFIG_DEVTMPFS CONFIG_BLK_DEV_INITRD \
          CONFIG_ARM_APPENDED_DTB CONFIG_ARM_ATAG_DTB_COMPAT CONFIG_SERIAL_EARLYCON \
          CONFIG_PARTITION_ADVANCED CONFIG_CMDLINE_PARTITION \
          CONFIG_MMC_DW_ROCKCHIP CONFIG_EXT4_FS CONFIG_EXT4_FS_POSIX_ACL CONFIG_DW_WATCHDOG ; do
          scripts/config --enable "$sym"
        done
        scripts/config --enable  CONFIG_ARM_ATAG_DTB_COMPAT_CMDLINE_FROM_BOOTLOADER
        scripts/config --disable CONFIG_ARM_ATAG_DTB_COMPAT_CMDLINE_EXTEND

        make ARCH="${ARCH}" CROSS_COMPILE="${CROSS_COMPILE}" olddefconfig

        # ========================================================
        # 【修改点 C2】兜底：不同版本的 scripts/config 在 .config 里找不到某个
        # 符号时行为不一致（有的直接报错、有的静默跳过），这里再按文本强制写一遍，
        # 然后重跑 olddefconfig 让依赖（PARTITION_ADVANCED → CMDLINE_PARTITION）
        # 正确落盘。多这一步成本近乎为零，但能避免"编译成功、分区却没有"的黑盒。
        # ========================================================
        for sym in CONFIG_PARTITION_ADVANCED CONFIG_CMDLINE_PARTITION; do
          sed -i "s/^# ${sym} is not set/${sym}=y/" .config
          grep -q "^${sym}=y" .config || echo "${sym}=y" >> .config
        done
        make ARCH="${ARCH}" CROSS_COMPILE="${CROSS_COMPILE}" olddefconfig

        echo "===== 关键符号校验 ====="
        # ========================================================
        # 【修改点 C3】上一版的校验只查了 CONFIG_PARTITION_ADVANCED，等于没查：
        # 真正决定 blkdevparts 是否生效的是 CONFIG_CMDLINE_PARTITION。
        # 这里把两个分区符号 + 启动链路必需符号一起校验，缺任何一个直接失败，
        # 不产出"注定 panic"的刷机包。
        # ========================================================
        for sym in CONFIG_PARTITION_ADVANCED CONFIG_CMDLINE_PARTITION \
                   CONFIG_MMC_DW_ROCKCHIP CONFIG_EXT4_FS CONFIG_DEVTMPFS \
                   CONFIG_ARM_ATAG_DTB_COMPAT_CMDLINE_FROM_BOOTLOADER; do
          grep -q "^${sym}=y" .config || { echo "❌ ${sym} 未启用"; exit 1; }
          echo "  ✅ ${sym}=y"
        done
        grep -E "CONFIG_(PARTITION_ADVANCED|CMDLINE_PARTITION)=" .config

        mkdir -p "arch/${ARCH}/boot/dts/rockchip"
        cp "$GITHUB_WORKSPACE/dts/"*.dts "arch/${ARCH}/boot/dts/rockchip/"

        make ARCH="${ARCH}" CROSS_COMPILE="${CROSS_COMPILE}" -j"$(nproc)" "${KERNEL_IMAGE}"
        make ARCH="${ARCH}" CROSS_COMPILE="${CROSS_COMPILE}" -j"$(nproc)" dtbs
        make ARCH="${ARCH}" CROSS_COMPILE="${CROSS_COMPILE}" -j"$(nproc)" modules
        make ARCH="${ARCH}" CROSS_COMPILE="${CROSS_COMPILE}" -j"$(nproc)" "rockchip/${BOARD}.dtb"

        sudo make ARCH="${ARCH}" CROSS_COMPILE="${CROSS_COMPILE}" \
          INSTALL_MOD_PATH="$GITHUB_WORKSPACE/usb_pure_rootfs" modules_install
        sudo chroot "$GITHUB_WORKSPACE/usb_pure_rootfs" /bin/bash -c 'depmod -a 2>/dev/null || true' || true

        mkdir -p "$GITHUB_WORKSPACE/dtb_out"
        find "arch/${ARCH}/boot/dts" -name "*.dtb" -exec cp {} "$GITHUB_WORKSPACE/dtb_out/" \;
        cp "arch/${ARCH}/boot/${KERNEL_IMAGE}" "$GITHUB_WORKSPACE/${KERNEL_IMAGE}"

        # 【修改点 C4】把编译出的 .config 带进产物，出问题可以第一现场核对
        # （上一轮排查"分区解析器到底有没有编进去"就是缺少这份实物证据）
        cp .config "$GITHUB_WORKSPACE/kernel.config"

        test -f "$GITHUB_WORKSPACE/dtb_out/${BOARD}.dtb" || { echo "❌ 找不到 ${BOARD}.dtb"; exit 1; }
        echo "✅ 内核与 dtb 编译完成"

    # ============================================================
    # 步骤 7：打包刷机镜像
    # ============================================================
    - name: 7. 打包刷机镜像
      run: |
        set -euo pipefail
        FINAL_DIR="rk-flash-${DEVICE_MODEL}-${DISTRO}-${CODENAME}-K${KERNEL_VERSION}"
        mkdir -p "$FINAL_DIR"

        ROOTFS_MB=$(sudo du -sm usb_pure_rootfs | cut -f1)
        IMG_MB=$(( ROOTFS_MB * 130 / 100 ))
        # 【修改点 F3】镜像下限从 2048MB 降到 1024MB。
        # 实测 rootfs 实际只有 289MB，做 2GiB 镜像纯属浪费：每次刷机要多写 1GiB，
        # 刷写时间翻倍、中途被打断/工具写不完的概率也翻倍（这正是这几轮反复怀疑
        # "rootfs 没写进去" 的根源）。1024MB 对 289MB 的内容仍有 3.5 倍余量。
        [ "$IMG_MB" -lt 1024 ] && IMG_MB=1024
        echo "rootfs 实际 ${ROOTFS_MB}MB，镜像 ${IMG_MB}MB（下限 1024MB）"

        truncate -s "${IMG_MB}M" "$FINAL_DIR/rootfs.img"
        mkfs.ext4 -F -L rootfs "$FINAL_DIR/rootfs.img"
        mkdir -p mnt_rootfs
        sudo mount -o loop "$FINAL_DIR/rootfs.img" mnt_rootfs
        sudo cp -a usb_pure_rootfs/. mnt_rootfs/
        sync
        sudo umount mnt_rootfs
        rmdir mnt_rootfs
        e2fsck -p -f "$FINAL_DIR/rootfs.img" || true
        echo "✅ rootfs.img: $(stat -c%s "$FINAL_DIR/rootfs.img") 字节"

        # ========================================================
        # 【修改点 E1】rootfs.img 有效性自检（第六轮新增）
        #
        # 第六轮实机日志（ttl-rz5）已经证明分区没问题：
        #   mmcblk1: p1(rootfs)            ← 分区建出来了
        #   b301 3846144 mmcblk1p1         ← 大小对（20MiB~盘尾）
        # 但紧接着：
        #   No filesystem could mount root, tried: ext4
        #   Kernel panic ... "/dev/mmcblk1p1" or unknown-block(179,1)
        # 这句和上一轮不是一回事：设备节点存在、ext4 已内建，是"这个分区里
        # 没有 ext4 超级块"。只有两种可能，必须分开：
        #   a) 产物里的 rootfs.img 本身坏了/没打进去  ← 本段自检在 CI 阶段就拦
        #   b) 镜像没问题，但刷机时 rootfs 那一行根本没写进 eMMC 的 0xA000
        #      （勾选漏了 / 文件路径还是旧的 / 用"升级固件"页只写了 loader）
        # ext4 关键位置：超级块在文件偏移 1024，s_magic 在 +0x38（0x53EF），
        # s_volume_name 在 +0x78（应为 rootfs）。
        # ========================================================
        python3 - "$FINAL_DIR/rootfs.img" << 'PY'
        import os, sys
        path = sys.argv[1]
        with open(path, 'rb') as f:
            head = f.read(2048)
        magic = head[1024 + 0x38:1024 + 0x38 + 2]
        label = head[1024 + 0x78:1024 + 0x78 + 16].rstrip(b'\x00').decode('utf-8', 'replace')
        size_mb = os.path.getsize(path) / 1048576
        print('rootfs.img 大小      : %.1f MiB' % size_mb)
        print('rootfs.img ext4 魔数 : %s（应为 53ef）' % magic.hex())
        print('rootfs.img 卷标      : %r（应为 rootfs）' % label)
        assert magic == b'\x53\xef', 'rootfs.img 0x400+0x38 处不是 ext4 超级块（0x53EF）'
        assert label == 'rootfs', 'rootfs.img 卷标不是 rootfs（/etc/fstab 用 LABEL=rootfs 会挂错）'
        assert size_mb >= 1024, 'rootfs.img 小于 1GiB，刷进去装不下系统（下限见 F3）'
        print('✅ rootfs.img 自检通过：是有效 ext4、卷标 rootfs、大小 %.0f MiB' % size_mb)
        PY
        echo "---- ext4 头信息（对照刷机后 blkid 应该一致）----"
        dumpe2fs -h "$FINAL_DIR/rootfs.img" 2>/dev/null \
          | grep -E "Filesystem volume name|Block count|Free blocks|Block size|Filesystem features" || true

        mkdir -p "$FINAL_DIR/dtb"
        cp dtb_out/*.dtb "$FINAL_DIR/dtb/"
        DTB_FILE="dtb_out/${BOARD}.dtb"
        test -f "$DTB_FILE" || { echo "❌ 找不到 $DTB_FILE"; exit 1; }

        cat "${KERNEL_IMAGE}" "$DTB_FILE" > zImage-dtb

        # ========================================================
        # 【修改点 D1】cmdline 只保留一个来源：parameter.txt
        #
        # 上一版在 workflow 里又手写了一份 CMDLINE_BOOT（root=/dev/mmcblk1p1，
        # 没有 blkdevparts），和 parameter.txt 里的 CMDLINE 是两处独立维护。
        # 实测教训：loader 真正传给内核的是 parameter.txt 的 CMDLINE（日志里
        # Kernel command line 与 parameter 一字不差，末尾还会被 loader 追加
        # bootver/firmware_ver），boot.img 头里的 cmdline 只用于自检。
        # 两处各写一份，改一处忘一处就出现"头里写了、实机没有"的假象。
        # 现在直接抽取 parameter.txt 的 CMDLINE，两边永远一致。
        # ========================================================
        CMDLINE_BOOT=$(grep -m1 '^CMDLINE:' "$GITHUB_WORKSPACE/parameter.txt" \
                       | sed -e 's/^CMDLINE:/ /' -e 's/^[[:space:]]*//')
        echo "参数文件 cmdline: ${CMDLINE_BOOT}"

        # ========================================================
        # 【修改点 D2】硬性校验：没有 blkdevparts / root= 没对准 p1，直接失败。
        # eMMC 上没有 MBR/GPT（ttl-rz4 日志 unknown-block(179,1) 已证明），
        # 缺了 blkdevparts 就必然复制上一轮那次 panic，没必要白刷一次。
        # ========================================================
        case "${CMDLINE_BOOT}" in
          *blkdevparts=mmcblk1:*\(rootfs\)*)
            echo "  ✅ CMDLINE 含 blkdevparts=mmcblk1:... (rootfs)" ;;
          *)
            echo "❌ parameter.txt 的 CMDLINE 缺少 blkdevparts=mmcblk1:-@24M(rootfs)"
            exit 1 ;;
        esac
        # 【第八轮】ttl-rz8 实测：工具把 rootfs.img 写到了 24MiB，不是 20MiB。
        # 内核 blkdevparts 与工具 mtdparts 必须指向同一个起点，这里硬校验两个数：
        #   blkdevparts ... @24M      （字节单位）
        #   mtdparts    ... @0x0000C000(rootfs)   （扇区单位，0xC000×512=24MiB）
        # 任何一处漏改，恢复出来的就是前七轮那种 "分区对、ext4 却读不到"。
        case "${CMDLINE_BOOT}" in
          *blkdevparts=mmcblk1:-@24M\(rootfs\)*)
            echo "  ✅ blkdevparts rootfs 起点 = 24MiB" ;;
          *)
            echo "❌ blkdevparts 起点必须是与 mtdparts 一致的 24MiB（@24M）"
            exit 1 ;;
        esac
        case "${CMDLINE_BOOT}" in
          *\-@0x0000C000\(rootfs\)*)
            echo "  ✅ mtdparts rootfs 起点 = 0x0000C000（24MiB，与 blkdevparts 对齐）" ;;
          *)
            echo "❌ mtdparts 的 rootfs 起点必须写成 -@0x0000C000(rootfs)（24MiB）"
            exit 1 ;;
        esac
        case "${CMDLINE_BOOT}" in
          *root=/dev/mmcblk1p1*)
            echo "  ✅ CMDLINE root=/dev/mmcblk1p1（与 blkdevparts 建出的 rootfs=p1 对应）" ;;
          *)
            echo "❌ root= 必须与 blkdevparts 建出的分区号一致（本方案 rootfs 是 p1）"
            exit 1 ;;
        esac

        # 【第七轮】loader 只有在 CMDLINE 里看到 initrd=<addr>,<size> 时才会把
        # boot.img 里的 ramdisk 搬到该地址并传 ATAG；ttl-rz7 就是缺这一项，
        # 所以内核完全没 unpack initramfs。缺它 = 救援 init 白打，直接判失败。
        case "${CMDLINE_BOOT}" in
          *initrd=0x62000000,*)
            echo "  ✅ CMDLINE 含 initrd=0x62000000,...（loader 会搬 ramdisk）" ;;
          *)
            echo "❌ CMDLINE 缺少 initrd=0x62000000,0x00800000"
            exit 1 ;;
        esac
        [ "${#CMDLINE_BOOT}" -le 500 ] \
          || { echo "❌ CMDLINE ${#CMDLINE_BOOT} 字节，超过 boot.img 头 512 字节上限"; exit 1; }

        rm -rf mkbootimg-src
        git clone --depth 1 https://github.com/neo-technologies/rockchip-mkbootimg.git mkbootimg-src
        make -C mkbootimg-src

        # ========================================================
        # 【修改点 F】给 boot.img 塞一个"救援 initramfs"（第七轮新增）
        #
        # 前六轮日志都停在同一个位置，且是同一个含义：
        #   mmcblk1: p1(rootfs)       /  b301 3846144 mmcblk1p1   ← 分区完全正确
        #   No filesystem could mount root, tried: ext4
        #   Kernel panic ... "/dev/mmcblk1p1" or unknown-block(179,1)
        # 设备节点存在、ext4 已内建，却读不到超级块。内核到此为止再没有任何
        # 能力告诉我们"eMMC 20MiB 那段里到底写着什么"。只能让内核先跑我们
        # 自己的 /init：
        #   1) 打印 /proc/partitions 和设备节点；
        #   2) 在多个候选偏移读 ext4 超级块（起始 +1024，magic 0x53EF）并打卷标；
        #   3) 把 20MiB 处前 64 字节原样 dump —— 全 00 = 没写；504b = 写成 zip；
        #      其它 = 别的东西，一眼定性；
        #   4) 找到 ext4 就挂载并 switch_root 继续正常启动（偏移不是 20MiB 也能起）。
        # 老 RK3188 loader 本来就必须支持 ramdisk（原厂 Android boot.img 就带），
        # ramdisk 地址对齐原厂的 0x62000000。
        # ========================================================
        sudo chroot "$GITHUB_WORKSPACE/usb_pure_rootfs" /bin/bash -c \
          'apt-get install -y --no-install-recommends busybox-static >/dev/null 2>&1 || true'
        if [ ! -f "$GITHUB_WORKSPACE/usb_pure_rootfs/bin/busybox" ]; then
          echo "❌ rootfs 里没有 /bin/busybox（busybox-static 装不上），无法生成救援 initramfs"
          exit 1
        fi

        IR="$GITHUB_WORKSPACE/rescue_initramfs"
        rm -rf "$IR"
        mkdir -p "$IR/bin" "$IR/proc" "$IR/sys" "$IR/dev" "$IR/newroot"
        sudo cp "$GITHUB_WORKSPACE/usb_pure_rootfs/bin/busybox" "$IR/bin/busybox"
        sudo chmod 755 "$IR/bin/busybox"
        sudo tee "$IR/init" > /dev/null <<'INIT_EOF'
        #!/bin/busybox sh
        /bin/busybox --install -s /bin 2>/dev/null
        export PATH=/bin:/sbin

        mount -t proc none /proc 2>/dev/null
        mount -t sysfs none /sys 2>/dev/null
        mount -t devtmpfs none /dev 2>/dev/null

        log() { echo "[rescue] $*"; }
        MB=1048576
        DISK=/dev/mmcblk1

        log "================ RK3188 救援 initramfs ================"
        log "这一段是 CI 打进 boot.img 的 /init，用来查 eMMC 里到底有什么"
        log "---- /proc/cmdline ----"
        cat /proc/cmdline
        log "---- /proc/partitions ----"
        cat /proc/partitions
        log "---- 设备节点 ----"
        ls -l /dev/mmcblk1 /dev/mmcblk1p1 2>/dev/null

        if [ ! -b "$DISK" ]; then
          log "❌ 没有 $DISK（MMC 驱动没起来，与 rootfs 无关）"
          exec sh
        fi

        # ext4 超级块固定在分区起始 +1024，magic 两字节在 +0x38
        magic_at() {
          dd if=$DISK bs=512 skip=$(( $1 / 512 + 2 )) count=1 2>/dev/null \
            | od -An -tx1 -N 58 | tr -s ' ' '\n' | grep -v '^$' | tail -2 | tr -d '\n'
        }
        label_at() {
          dd if=$DISK bs=8 skip=$(( ( $1 + 1144 ) / 8 )) count=2 2>/dev/null \
            | tr -d '\000' | tr -d '\n'
        }

        log "---- 候选偏移探测（ext4 超级块 magic 应为 53ef）----"
        FOUND=""
        for off in 20971520 41943040 25165824 29360128 33554432 16777216 8388608 67108864 134217728 268435456 0; do
          m=$(magic_at $off)
          if [ "$m" = "53ef" ]; then
            log "  $off 字节 (= $(( off / MB )) MiB) : ext4 ✅ 卷标=[$(label_at $off)]"
            [ -z "$FOUND" ] && FOUND=$off
          else
            log "  $off 字节 (= $(( off / MB )) MiB) : 无 ext4 (magic=$m)"
          fi
        done

        if [ -z "$FOUND" ]; then
          log "---- 候选都没命中，开始粗扫（1MiB 步长扫 4~128MiB，8MiB 步长扫到盘尾）----"
          off=4194304
          while [ $off -lt 134217728 ]; do
            if [ "$(magic_at $off)" = "53ef" ]; then
              log "  ✅ $off 字节 (= $(( off / MB )) MiB) 有 ext4，卷标=[$(label_at $off)]"
              [ -z "$FOUND" ] && FOUND=$off
            fi
            off=$(( off + 1048576 ))
          done
          off=134217728
          while [ $off -lt 3866624000 ]; do
            if [ "$(magic_at $off)" = "53ef" ]; then
              log "  ✅ $off 字节 (= $(( off / MB )) MiB) 有 ext4，卷标=[$(label_at $off)]"
              [ -z "$FOUND" ] && FOUND=$off
            fi
            off=$(( off + 8388608 ))
          done
          log "  粗扫结束"
        fi

        log "---- eMMC 20MiB 处原始前 64 字节（全 00=没写，504b=写成了zip，其它=旧数据）----"
        dd if=$DISK bs=512 skip=40960 count=1 2>/dev/null | od -An -tx1 -N 64

        if [ -z "$FOUND" ]; then
          log "❌ 所有候选偏移都没有 ext4 超级块 → rootfs.img 没有真正刷进 eMMC"
          log "   请把这段日志发出来；同时核对刷机工具里 rootfs 行的 勾选/文件/地址/耗时"
          exec sh
        fi

        log "✅ 在 $FOUND 字节 (= $(( FOUND / MB )) MiB) 找到 ext4，开始挂载"

        # 【第八轮修正 1】如果找到的起点正好等于内核建出的 p1 起点，就直接挂 p1，
        # 不绕 loop（loop 那一路在 busybox 下会把 offset 当 ext4 挂载参数传给内核，
        # ttl-rz8 里就出现了 "ext4: Unknown parameter 'offset'"）。
        P1_START_SECT=$(cat /sys/class/block/mmcblk1p1/start 2>/dev/null)
        if [ "$P1_START_SECT" = "$(( FOUND / 512 ))" ]; then
          log "  起点与 mmcblk1p1 一致（p1 start=$P1_START_SECT 扇区），直接挂 /dev/mmcblk1p1"
          mount -t ext4 -o rw /dev/mmcblk1p1 /newroot
        else
          log "  起点与 p1 不一致（p1 start=$P1_START_SECT 扇区），用 loop 挂"
          losetup -d /dev/loop0 2>/dev/null
          losetup -o $FOUND /dev/loop0 $DISK 2>/dev/null \
            && mount -t ext4 -o rw /dev/loop0 /newroot \
            || mount -t ext4 -o rw,loop,offset=$FOUND $DISK /newroot 2>/dev/null
        fi

        # 【第八轮修正 2】原检查 `[ -e /newroot/sbin/init ]` 在 Ubuntu 上是误判：
        # /sbin 是指向 /usr/sbin 的绝对软链，未 chroot 时内核按 initramfs 的 / 解析，
        # 必然找不到 → ttl-rz8 报 "没有 /sbin/init"，其实 rootfs 是好的。
        # 改成检查不带软链的实体文件。
        if [ ! -e /newroot/etc/os-release ] && [ ! -e /newroot/usr/lib/systemd/systemd ]; then
          log "❌ 挂上了，但看不到 /etc/os-release 和 /usr/lib/systemd/systemd —— 镜像内容不完整"
          log "   （若两者都在，说明是真 rootfs；这里顺带列一下根目录：）"
          ls -l /newroot | head -20
          exec sh
        fi
        log "  rootfs 内容确认：$(cat /newroot/etc/os-release 2>/dev/null | head -1)"
        df -h /newroot 2>/dev/null | tail -2

        log "✅ rootfs 已挂载，switch_root 到真实 /sbin/init"
        mount -t proc none /newroot/proc 2>/dev/null
        mount -t sysfs none /newroot/sys 2>/dev/null
        mount -t devtmpfs none /newroot/dev 2>/dev/null
        exec switch_root /newroot /sbin/init
        INIT_EOF
        sudo chmod 755 "$IR/init"

        # 【修改点 F2】不再依赖 cpio 命令
        # 上一轮 CI 就死在这一步：`gzip -dc ... | cpio -it | grep -qx './init'`
        # 报 "❌ initramfs 里没有 /init"，可归档明明有 868606 字节（内容是在的），
        # 是不同 cpio 版本下 `-t` 的列表输出/退出码形态不一致导致的误判。
        # 改为调用仓库里的 tools/mkinitramfs.py：自己写 newc 归档、自己回读校验，
        # 不依赖 runner 上装没装 cpio。
        MKI="$GITHUB_WORKSPACE/tools/mkinitramfs.py"
        [ -f "$MKI" ] || MKI="$GITHUB_WORKSPACE/mkinitramfs.py"
        [ -f "$MKI" ] || { echo "❌ 仓库里找不到 tools/mkinitramfs.py"; exit 1; }
        python3 "$MKI" --create "$IR" "$FINAL_DIR/initramfs.cpio.gz"
        echo "✅ initramfs.cpio.gz: $(stat -c%s "$FINAL_DIR/initramfs.cpio.gz") 字节"
        python3 "$MKI" --verify "$FINAL_DIR/initramfs.cpio.gz" /init /bin/busybox

        ./mkbootimg-src/mkbootimg \
          --kernel zImage-dtb \
          --ramdisk "$FINAL_DIR/initramfs.cpio.gz" \
          --ramdiskaddr 0x62000000 \
          --cmdline "$CMDLINE_BOOT" \
          -o "$FINAL_DIR/boot.img"
        echo "✅ boot.img（含救援 initramfs）: $(stat -c%s "$FINAL_DIR/boot.img") 字节"

        # 保险件：万一老 loader 对 ramdisk 不感冒，连 "Starting kernel" 都不打，
        # 就用这个纯内核版 boot-nord.img 回退（行为与前六轮完全一致）。
        ./mkbootimg-src/mkbootimg \
          --kernel zImage-dtb \
          --cmdline "$CMDLINE_BOOT" \
          -o "$FINAL_DIR/boot-nord.img"
        echo "✅ boot-nord.img（无 ramdisk，回退用）: $(stat -c%s "$FINAL_DIR/boot-nord.img") 字节"

        # ========================================================
        # 【修改点 D3】回读 boot.img 头做二次确认
        # 标准 Android boot image：magic "ANDROID!"，page_size 16384（RK3188）。
        # 第七轮起 ramdisk 里带救援 init，所以 ramdisk_size 不再为 0，
        # 同时要确认 ramdisk_addr 是原厂的 0x62000000、kernel 仍是 0x60408000。
        # ========================================================
        python3 - "$FINAL_DIR/boot.img" "$FINAL_DIR/boot-nord.img" << 'PY'
        import sys, struct
        for path, expect_ramdisk in ((sys.argv[1], True), (sys.argv[2], False)):
            with open(path, 'rb') as f:
                head = f.read(16384)
            assert head[:8] == b'ANDROID!', path + ' 头不是 ANDROID!（打包格式错误）'
            ksize, kaddr, rsize, raddr = struct.unpack('<4I', head[0x08:0x18])
            page = struct.unpack('<I', head[0x24:0x28])[0]
            cmd = head[0x40:0x40 + 512].split(b'\0')[0].decode('utf-8', 'replace')
            print('----', path.split('/')[-1], '----')
            print('  cmdline      :', cmd)
            print('  kernel_addr  : 0x%08x  kernel_size: %d' % (kaddr, ksize))
            print('  ramdisk_addr : 0x%08x  ramdisk_size: %d' % (raddr, rsize))
            print('  page_size    :', page)
            for token in ('blkdevparts=mmcblk1:', 'root=/dev/mmcblk1p1', 'console=ttyS2'):
                assert token in cmd, path + ' 头 cmdline 缺少: ' + token
            assert kaddr == 0x60408000, path + ' kernel_addr 应为 0x60408000'
            assert page == 16384, path + ' page_size 应为 16384'
            if expect_ramdisk:
                assert rsize > 0, 'boot.img 里没有 ramdisk（救援 init 没打进去）'
                assert raddr == 0x62000000, 'boot.img ramdisk_addr 应为 0x62000000'
            else:
                assert rsize == 0, 'boot-nord.img 不应该带 ramdisk'
        print('✅ 两个 boot 镜像头校验通过（boot.img 带救援 ramdisk，boot-nord.img 纯净）')
        PY

        if [ -f "$GITHUB_WORKSPACE/inspect_rk_img.sh" ]; then
          chmod +x "$GITHUB_WORKSPACE/inspect_rk_img.sh"
          "$GITHUB_WORKSPACE/inspect_rk_img.sh" "$FINAL_DIR/boot.img" \
            | tee "$FINAL_DIR/boot-inspect.txt"
        fi

        cp "$GITHUB_WORKSPACE/parameter.txt" "$FINAL_DIR/parameter.txt"
        cp "$GITHUB_WORKSPACE/kernel.config" "$FINAL_DIR/kernel.config"

        # ========================================================
        # 【修改点 D4】删除 wipe-emmc.sh
        # 上一版让用户刷机前 dd 擦 eMMC 前 1MiB，理由写的是"擦掉旧 MBR 让 loader
        # 重建分区表"。两处都是错的：
        #   1) 前 1MiB 里是 loader 本体，擦掉可能直接让盒子进不了 loader；
        #   2) loader 从来不会按 mtdparts 写 MBR，分区表根本不存在（日志实证）。
        # 这个脚本只会制造风险，没有任何收益，整段删除。
        # ========================================================

        cat > "$FINAL_DIR/README.txt" << EOF
        设备: ${DEVICE_MODEL}  板型: ${BOARD}
        发行版: ${DISTRO} (${CODENAME})
        内核: ${KERNEL_VERSION}  架构: ${UBUNTU_ARCH}

        ========== 刷机步骤 ==========
        1. RKDevTool 用 "下载镜像" 页（Download Image），不是 "升级固件" 页。
           "升级固件" 吃的是单个 update.img，本包给的是分立的 4 个文件，
           在那个页面上你选了也不会真的把 rootfs.img 写进 eMMC。
           四行必须全部【打勾】，地址与文件严格对应：
             #1 Loader     0x00000000   loader.bin（原厂，本包未附带则用现有的）
             #2 Parameter  0x00000000   本目录的 parameter.txt
             #3 boot       0x00002000   本目录的 boot.img      （= 4 MiB）
             #4 rootfs     0x0000C000   本目录的 rootfs.img    （= 24 MiB）
        2. 点击 "执行"。rootfs.img 约 1GiB（内容 289MB，下限 1024MB），
           rootfs 那一行会走 1~3 分钟；
           如果整个刷机几秒钟就结束，说明 rootfs 根本没写下去 —— 这就是
           第六轮 "No filesystem could mount root, tried: ext4" 的原因。
        3. 串口 ttyS2 / 115200 查看启动日志（本机 TTL 物理接 UART2）
        4. 【无需】再擦 eMMC 分区表：eMMC 本来就没有分区表，
           rootfs 分区由内核按 CMDLINE 的 blkdevparts 现场创建。

        ========== 刷机前先核对镜像指纹 ==========
          MANIFEST.sha256 里有 parameter.txt / boot.img / boot-nord.img / rootfs.img
          的 SHA256。rootfs.img 下载被截断 = 刷进去没有 ext4 超级块，症状和前几轮
          一模一样。
            Linux  : sha256sum -c MANIFEST.sha256
            Windows: certutil -hashfile rootfs.img SHA256

        ========== ★ 本轮真正的修复：rootfs 起点 20MiB → 24MiB ★ ==========
          ttl-rz8 里救援 init 逐个偏移扫 ext4 超级块，结果是：
              20 MiB（0x0000A000）→ magic=0000，没有 ext4
              24 MiB（0x0000C000）→ ext4，卷标 [rootfs]   ← 真正的 rootfs 在这里
          而且 20MiB 处前 64 字节是 "ANDROID!"（一个残留的 boot.img 头）。
          也就是说：RKDevTool 实际把 rootfs.img 写到了 24MiB，不是 parameter 里
          写的 0xA000。前七轮"分区对了、root 也对了、ext4 却读不到"的真正原因
          就是这 4MiB 错位 —— 内核去 20MiB 找，数据在 24MiB。
          （20MiB 不是 8MiB 对齐点，24MiB 是它之后最近的 8MiB 边界，RK 工具按
           分区粒度对齐写入。）

          本包已经把三处统一到 24MiB：
              parameter.txt : blkdevparts=mmcblk1:-@24M(rootfs)
                              mtdparts=...,-@0x0000C000(rootfs)
              dts bootargs  : 同上
              CI 校验       : 两处偏移不一致直接失败
          所以你按本包 parameter + boot 刷，本包以后的 rootfs 也烧到 24MiB，
          两边永远对齐。

        ========== 第八轮（仍有效）：Parameter 里的 initrd= 不能删 ==========
          RK31 loader 只有看到 CMDLINE 里的
              initrd=0x62000000,0x00800000
          才会把 boot.img 里的 ramdisk 搬到 0x62000000 交给内核；删掉它，
          救援 init = 白打（ttl-rz7 实证：boot.img 带 ramdisk，内核却不 unpack）。
          原厂 parameter-bibl.txt 里本来就有这一项。

        ========== 这一次请先只刷这两行（快，10MB 级）==========
          #2 Parameter  0x00000000   parameter.txt   ← 必须换成本包的（@24M）
          #3 boot       0x00002000   boot.img        ← 带救援 init 的那份
          rootfs **不要**重刷：盘上 24MiB 那份就是这份 rootfs.img（救援 init 已
          实测挂上、卷标 [rootfs]、内容 288.8MB 与 CI 打印的 289MB 吻合）。
          刷完看日志：出现 "Run /sbin/init as init process" 就进系统了。

        ========== 救援 init 会打印什么 ==========
            - /proc/cmdline（核对 initrd= 有没有真的传进来）
            - 候选偏移逐个报告有没有 ext4 超级块（20MiB / 40MiB / 24MiB / 32MiB ...）
            - 候选不中时自动粗扫：1MiB 步长扫 4~128MiB，8MiB 步长扫到盘尾
            - 打印 eMMC 20MiB 处原始前 64 字节
              · 全是 00           → rootfs.img 根本没写进去
              · 开头是 504b 0304  → rootfs 那行选的文件其实是 zip，选错文件了
              · 开头是 53ef ...   → 数据在，是偏移/分区起点对不上
          找到 ext4 就 mount + switch_root 继续启动（偏移不是 20MiB 也能起来）。

          ⚠️ 只有"连 Starting kernel... 都不打印"时才用 boot-nord.img。
             ttl-rz5/6/7 都打印了 Starting kernel，所以那几轮**不该**用 boot-nord.img；
             如果这次还是看不到 [rescue]，请先确认 #3 那行选的是 boot.img（带 ramdisk 的）。

        ========== 验证成功标志（按顺序出现）==========
          Kernel command line: ... blkdevparts=mmcblk1:-@24M(rootfs) ...
          mmcblk1: p1
          EXT4-fs (mmcblk1p1): mounted filesystem with ordered data mode
          Run /sbin/init as init process
          （随后是 systemd 启动日志，登录提示符出现在 ttyS2）

        ========== 若仍失败的快速定位 ==========
          A. 日志里 Kernel command line 不含 blkdevparts
             → 刷机工具那行 Parameter 没换成本目录文件，重刷。
          B. 日志里有 blkdevparts 但没有 "mmcblk1: p1"
             → 打开本包 kernel.config，确认 CONFIG_CMDLINE_PARTITION=y；
               这一版 CI 已强制校验，正常不会缺。
          C. 有 p1、但报 "No filesystem could mount root, tried: ext4"
             → 分区起点和真实数据错开了。先看 [rescue] 的
               "候选偏移探测" 那一行：哪个偏移报了 ext4 / 卷标=[rootfs]，
               就把 parameter.txt 的 blkdevparts @NN M 与 mtdparts
               -@0x........(rootfs) 都改成那个位置，重刷 Parameter 即可。
          D. 有 p1、且能看到 EXT4-fs，但卡在 init
             → 才轮到 rootfs 内部（systemd/getty）问题，届时再发日志。

        ========== 账号 ==========
        root 密码: ${ROOT_PASSWORD}
        EOF

        # ========================================================
        # 【修改点 E2】产物指纹清单
        # rootfs.img 约 1GiB，下载过程一旦被截断，刷进去就是“没有 ext4 超级块”
        # 这种最费时间的假故障。这里生成 MANIFEST.sha256，刷机前先核对：
        #   Windows: certutil -hashfile rootfs.img SHA256
        #   Linux  : sha256sum -c MANIFEST.sha256
        # 指纹一致 → 镜像没坏，问题一定在“刷机时 rootfs 那行有没有真的写下去”。
        # ========================================================
        ( cd "$FINAL_DIR" && sha256sum parameter.txt boot.img boot-nord.img rootfs.img > MANIFEST.sha256 \
          && echo "---- MANIFEST.sha256 ----" && cat MANIFEST.sha256 )

        ZIP_NAME="${FINAL_DIR}.zip"
        cd "$FINAL_DIR"
        zip -q -r "../${ZIP_NAME}" .
        cd ..
        echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"

    # ============================================================
    # 步骤 8：上传 Release
    # ============================================================
    - name: 8. 上传到 Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: build-${{ github.run_number }}-${{ matrix.distro }}-${{ matrix.codename }}
        name: "RK3188 ${{ matrix.distro }} ${{ matrix.codename }} (Kernel ${{ inputs.kernel_version }}) - ${{ inputs.board }}"
        files: |
          ${{ env.ZIP_NAME }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
