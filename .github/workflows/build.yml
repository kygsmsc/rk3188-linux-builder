name: 编译 Rockchip 刷机包 (复用 lib 和 dts)

on:
  workflow_dispatch:
    inputs:
      distro:
        description: 'rootfs 发行版 (目前 lib 脚本仅完美兼容 Ubuntu)'
        required: true
        type: choice
        options:
          - ubuntu
          - debian
          - armbian
        default: 'ubuntu'

      device_model:
        description: '设备型号'
        required: true
        type: choice
        options:
          - rk3188
          - rk3288
          - rk3399
          - rk3528
          - rk3566
          - rk3588
        default: 'rk3188'

      kernel_version:
        description: '内核版本（从 kernel.org 下载）'
        required: true
        default: '6.12.116'

      ubuntu_version:
        description: 'Ubuntu Base 版本'
        required: false
        type: choice
        options:
          - '20.04.5'
          - '22.04.5'
          - '24.04.5'
        default: '22.04.5'

      debian_codename:
        description: 'Debian 代号（若选 debian）'
        required: false
        default: 'bookworm'

      armbian_board:
        description: 'Armbian 板子名（若选 armbian）'
        required: false
        default: 'rock-5b'

      armbian_release:
        description: 'Armbian 发行代号（若选 armbian）'
        required: false
        default: 'bookworm'

      armbian_branch:
        description: 'Armbian 分支（若选 armbian）'
        required: false
        type: choice
        options:
          - current
          - edge
          - vendor
        default: 'current'

      base_url:
        description: 'Ubuntu Base 下载根前缀'
        required: false
        default: 'https://cdimage.ubuntu.com/ubuntu-base/releases/20.04/release'

      mirror:
        description: 'apt 软件源镜像'
        required: false
        default: 'http://repo.huaweicloud.com/ubuntu-ports'

      root_password:
        description: 'root 登录密码'
        required: false
        default: 'root123'

      custom_mac:
        description: '自定义 eth0 MAC（留空则用原生）'
        required: false
        default: ''

      minimal_mode:
        description: '精简 B 级（yes = 移除 htop/bash-completion）'
        required: false
        type: choice
        options:
          - 'no'
          - 'yes'
        default: 'no'

      rootfs_size:
        description: 'rootfs.img 镜像大小 (例如 2G, 4G)'
        required: true
        default: '2G'

permissions:
  contents: write

jobs:
  build-rockchip:
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    env:
      DISTRO: ${{ inputs.distro }}
      DEVICE_MODEL: ${{ inputs.device_model }}
      KERNEL_VERSION: ${{ inputs.kernel_version }}
      UBUNTU_VERSION: ${{ inputs.ubuntu_version }}
      DEBIAN_CODENAME: ${{ inputs.debian_codename }}
      ARMBIAN_BOARD: ${{ inputs.armbian_board }}
      ARMBIAN_RELEASE: ${{ inputs.armbian_release }}
      ARMBIAN_BRANCH: ${{ inputs.armbian_branch }}
      BASE_URL: ${{ inputs.base_url }}
      MIRROR: ${{ inputs.mirror }}
      ROOT_PASSWORD: ${{ inputs.root_password }}
      CUSTOM_MAC: ${{ inputs.custom_mac }}
      MINIMAL_MODE: ${{ inputs.minimal_mode }}
      ROOTFS_SIZE: ${{ inputs.rootfs_size }}

    steps:
    - name: 1. 检出代码
      uses: actions/checkout@v4

    - name: 2. 解析架构与工具链
      run: |
        case "${DEVICE_MODEL}" in
          rk3188|rk3288)
            echo "ARCH=arm" >> "$GITHUB_ENV"
            echo "CROSS_COMPILE=arm-linux-gnueabihf-" >> "$GITHUB_ENV"
            echo "KERNEL_IMAGE=zImage" >> "$GITHUB_ENV"
            echo "UBUNTU_ARCH=armhf" >> "$GITHUB_ENV"
            echo "QEMU_STATIC=qemu-arm-static" >> "$GITHUB_ENV"
            ;;
          rk3399|rk3528|rk3566|rk3588)
            echo "ARCH=arm64" >> "$GITHUB_ENV"
            echo "CROSS_COMPILE=aarch64-linux-gnu-" >> "$GITHUB_ENV"
            echo "KERNEL_IMAGE=Image" >> "$GITHUB_ENV"
            echo "UBUNTU_ARCH=arm64" >> "$GITHUB_ENV"
            echo "QEMU_STATIC=qemu-aarch64-static" >> "$GITHUB_ENV"
            ;;
          *) echo "❌ 不支持的设备"; exit 1 ;;
        esac

        if [ "${DISTRO}" = "ubuntu" ]; then
          case "${UBUNTU_VERSION}" in
            20.04.*) echo "CODENAME=focal" >> "$GITHUB_ENV" ;;
            22.04.*) echo "CODENAME=jammy" >> "$GITHUB_ENV" ;;
            24.04.*) echo "CODENAME=noble" >> "$GITHUB_ENV" ;;
          esac
        elif [ "${DISTRO}" = "debian" ]; then
          echo "CODENAME=${DEBIAN_CODENAME}" >> "$GITHUB_ENV"
        else
          echo "CODENAME=armbian" >> "$GITHUB_ENV"
        fi

    - name: 3. 安装编译与打包依赖
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq \
          build-essential flex bison libssl-dev libelf-dev bc rsync \
          qemu-user-static e2fsprogs zip xz-utils kpartx mkbootimg android-sdk-libsparse-utils \
          gcc-arm-linux-gnueabihf gcc-aarch64-linux-gnu

    - name: 4. 缓存 rootfs
      uses: actions/cache@v4
      with:
        path: cache/*
        key: rootfs-${{ env.DISTRO }}-${{ env.UBUNTU_VERSION || env.DEBIAN_CODENAME || env.ARMBIAN_RELEASE }}-${{ env.UBUNTU_ARCH }}

    - name: 5. 下载并解压 rootfs (送入 usb_pure_rootfs)
      run: |
        mkdir -p cache
        rm -rf usb_pure_rootfs
        mkdir -p usb_pure_rootfs

        if [ "${DISTRO}" = "ubuntu" ]; then
          BASE_FILE="ubuntu-base-${UBUNTU_VERSION}-base-${UBUNTU_ARCH}.tar.gz"
          BASE_FULL_URL="${BASE_URL}/${CODENAME}/release/${BASE_FILE}"
          
          if [ ! -s "cache/${BASE_FILE}" ]; then
            wget --no-check-certificate -q --tries=3 --timeout=60 -O "cache/${BASE_FILE}.tmp" "${BASE_FULL_URL}" || true
            if [ ! -s "cache/${BASE_FILE}.tmp" ]; then
              AVAILABLE=$(wget -q -O - "${BASE_URL}/${CODENAME}/release/" 2>/dev/null | grep -oE "ubuntu-base-[0-9]+\.[0-9]+\.[0-9]+-base-${UBUNTU_ARCH}\.tar\.gz" | sort -V | tail -1)
              [ -z "$AVAILABLE" ] && { echo "❌ 找不到可用 Ubuntu Base"; exit 1; }
              BASE_FILE="$AVAILABLE"
              BASE_FULL_URL="${BASE_URL}/${CODENAME}/release/${BASE_FILE}"
              wget --no-check-certificate -q --tries=5 --timeout=120 "${BASE_FULL_URL}" -O "cache/${BASE_FILE}"
            else
              mv "cache/${BASE_FILE}.tmp" "cache/${BASE_FILE}"
            fi
          fi
          sudo tar -xpf "cache/${BASE_FILE}" -C usb_pure_rootfs

        elif [ "${DISTRO}" = "debian" ]; then
          DEBIAN_BASE="https://storage.kernelci.org/images/rootfs/debian/${CODENAME}"
          LATEST_DATE=$(wget -q -O - "${DEBIAN_BASE}/" 2>/dev/null | grep -oE '[0-9]{8}\.[0-9]+' | sort -V | tail -1)
          [ -z "$LATEST_DATE" ] && { echo "❌ 找不到 Debian 构建"; exit 1; }
          DEBIAN_URL="${DEBIAN_BASE}/${LATEST_DATE}/${UBUNTU_ARCH}/full.rootfs.tar.xz"
          wget --no-check-certificate -q --tries=5 --timeout=300 -O "cache/debian.tar.xz" "${DEBIAN_URL}"
          sudo tar -xJpf "cache/debian.tar.xz" -C usb_pure_rootfs

        elif [ "${DISTRO}" = "armbian" ]; then
          ARMBIAN_RELEASE_CAP=$(echo "${ARMBIAN_RELEASE}" | sed 's/^./\U&/')
          ARMBIAN_URL="https://dl.armbian.com/${ARMBIAN_BOARD}/${ARMBIAN_RELEASE_CAP}_${ARMBIAN_BRANCH}_minimal"
          wget --no-check-certificate -q --tries=5 --timeout=600 -O cache/armbian.img.xz "${ARMBIAN_URL}"
          xz -dkc cache/armbian.img.xz > cache/armbian.img
          LOOP=$(sudo losetup -fP --show cache/armbian.img)
          sleep 2
          ROOT_PART=$(sudo lsblk -lnpo NAME,SIZE "$LOOP" | sort -k2 -n | tail -1 | awk '{print $1}')
          sudo mount -o ro "$ROOT_PART" /mnt
          sudo cp -a /mnt/. usb_pure_rootfs/
          sudo umount /mnt
          sudo losetup -d "$LOOP"
        fi

    - name: 6. 调用现有 lib 脚本构建纯净 rootfs
      run: |
        # 强制使用 usb 模式输出到 usb_pure_rootfs
        export MODE=usb
        export ROOTFS_DIR="$PWD/usb_pure_rootfs"
        export TARGET_HOSTNAME="${DEVICE_MODEL}"
        chmod +x build_rootfs.sh lib/*.sh
        # 直接执行你的神仙脚本
        sudo -E ./build_rootfs.sh
        
        echo "========== 你的 rootfs 构建完毕 =========="
        sudo du -sh usb_pure_rootfs

    - name: 7. 编译内核、DTS 与模块
      run: |
        KERNEL_MAJOR=$(echo "${KERNEL_VERSION}" | cut -d. -f1)
        KERNEL_TARBALL="linux-${KERNEL_VERSION}.tar.xz"
        wget -q --show-progress "https://cdn.kernel.org/pub/linux/kernel/v${KERNEL_MAJOR}.x/${KERNEL_TARBALL}" -O "${KERNEL_TARBALL}"
        tar xf "${KERNEL_TARBALL}"
        cd "linux-${KERNEL_VERSION}"

        # 生成 defconfig
        if [ "${ARCH}" = "arm64" ] && [ -f "arch/arm64/configs/rockchip_defconfig" ]; then
          make ARCH="${ARCH}" CROSS_COMPILE="${CROSS_COMPILE}" rockchip_defconfig
        else
          make ARCH="${ARCH}" CROSS_COMPILE="${CROSS_COMPILE}" defconfig
        fi

        # ！！！关键 1：把你的 dts 拷入源码树 ！！！
        echo "复制自定义 dts 到内核源码树..."
        mkdir -p arch/${ARCH}/boot/dts/rockchip
        cp $GITHUB_WORKSPACE/dts/*.dts arch/${ARCH}/boot/dts/rockchip/ 2>/dev/null || true
        cp $GITHUB_WORKSPACE/dts/*.dts arch/${ARCH}/boot/dts/ 2>/dev/null || true

        # 编译内核、设备树和模块
        make ARCH="${ARCH}" CROSS_COMPILE="${CROSS_COMPILE}" -j$(nproc) "${KERNEL_IMAGE}"
        make ARCH="${ARCH}" CROSS_COMPILE="${CROSS_COMPILE}" -j$(nproc) dtbs
        make ARCH="${ARCH}" CROSS_COMPILE="${CROSS_COMPILE}" -j$(nproc) modules

        # ！！！关键 2：显式点名编译你的 dts，防止内核 Makefile 忽略它 ！！！
        echo "显式编译自定义 DTS..."
        for dts_file in $GITHUB_WORKSPACE/dts/*.dts; do
          if [ -f "$dts_file" ]; then
            DTS_NAME=$(basename "$dts_file" .dts)
            echo "尝试编译: ${DTS_NAME}.dtb"
            # 尝试在 rockchip 子目录编译（优先）
            make ARCH="${ARCH}" CROSS_COMPILE="${CROSS_COMPILE}" -j$(nproc) rockchip/${DTS_NAME}.dtb 2>/dev/null || true
            # 尝试在根 dts 目录编译（兜底）
            make ARCH="${ARCH}" CROSS_COMPILE="${CROSS_COMPILE}" -j$(nproc) ${DTS_NAME}.dtb 2>/dev/null || true
          fi
        done

        sudo make ARCH="${ARCH}" CROSS_COMPILE="${CROSS_COMPILE}" INSTALL_MOD_PATH="$GITHUB_WORKSPACE/usb_pure_rootfs" modules_install

        # 收集生成的 DTB 供打包
        mkdir -p "$GITHUB_WORKSPACE/dtb_out"
        find arch/${ARCH}/boot/dts -name "*.dtb" -exec cp {} "$GITHUB_WORKSPACE/dtb_out/" \; 2>/dev/null || true
        
        # 把 zImage/Image 拿出来
        cp "arch/${ARCH}/boot/${KERNEL_IMAGE}" "$GITHUB_WORKSPACE/${KERNEL_IMAGE}" 2>/dev/null || true

    - name: 8. 打包瑞芯微刷机所需镜像 (boot.img, rootfs.img, parameter.txt)
      run: |
        FINAL_DIR="rk-flash-${DEVICE_MODEL}-Ubuntu_${UBUNTU_VERSION}-K${KERNEL_VERSION}"
        mkdir -p "$FINAL_DIR"
        
        # 1. 制作 rootfs.img (Ext4 格式)
        echo "开始制作 rootfs.img (大小 ${ROOTFS_SIZE})..."
        truncate -s "${ROOTFS_SIZE}" "$FINAL_DIR/rootfs.img"
        mkfs.ext4 -F -L rootfs "$FINAL_DIR/rootfs.img"
        mkdir -p mnt_rootfs
        sudo mount -o loop "$FINAL_DIR/rootfs.img" mnt_rootfs
        sudo cp -a usb_pure_rootfs/. mnt_rootfs/
        sudo umount mnt_rootfs
        rmdir mnt_rootfs

        # 2. 把单独导出的 dtb 也放进压缩包，方便用户提取
        # ！！！关键 3：将 dtb_out 里的文件全部拷贝到最终包里 ！！！
        mkdir -p "$FINAL_DIR/dtb"
        cp dtb_out/*.dtb "$FINAL_DIR/dtb/" 2>/dev/null || echo "⚠️ 未找到任何 dtb"

        # 3. 制作 boot.img (包含 zImage/Image 与 DTB)
        # 默认选取匹配设备型号的 dtb，匹配不到则选第一个
        DTB_FILE=$(ls dtb_out/*${DEVICE_MODEL}*.dtb 2>/dev/null | head -1)
        if [ -z "$DTB_FILE" ]; then
          DTB_FILE=$(ls dtb_out/*.dtb 2>/dev/null | head -1)
        fi
        
        if [ -n "$DTB_FILE" ] && [ -f "${KERNEL_IMAGE}" ]; then
          echo "正在使用 ${DTB_FILE} 与 ${KERNEL_IMAGE} 打包 boot.img..."
          # 生成一个 1MB 的假空 ramdisk，防止部分版本 mkbootimg 因为 ramdisk 为空报错
          dd if=/dev/zero of=empty_ramdisk bs=1M count=1
          mkbootimg --kernel "${KERNEL_IMAGE}" --dtb "${DTB_FILE}" --ramdisk empty_ramdisk -o "$FINAL_DIR/boot.img"
          rm -f empty_ramdisk
        else
          echo "❌ 错误：缺少内核或 DTB，无法生成 boot.img"
          exit 1
        fi

        # 4. 生成 parameter.txt (4G eMMC 最简分区表)
        cat > "$FINAL_DIR/parameter.txt" << 'EOF'
        FIRMWARE_VER:8.1.0
        MACHINE_MODEL:RK3188
        MACHINE_ID:007
        MANUFACTURER: RK3188
        MAGIC: 0x5041524B
        ATAG: 0x00200800
        MACHINE: 0xffffffff
        CHECK_MASK: 0x80
        PWR_HLD: 0,0,A,0,1
        TYPE: GPT
        CMDLINE: mtdparts=rk29xxnand:0x00002000@0x00004000(uboot),0x00002000@0x00006000(trust),0x00010000@0x00008000(boot),0x00080000@0x00018000(rootfs),-@0x00098000(userdata)
        UUID: 614e0000-0000-4b53-8000-1d28000054a9
        EOF

        # 5. 写个说明
        cat > "$FINAL_DIR/README.txt" << EOF
        设备型号: ${DEVICE_MODEL}
        架构: ${ARCH}
        内核版本: ${KERNEL_VERSION}
        
        使用瑞芯微开发工具(RKDevTool)刷机:
        1. 选择 Loader (你的原厂 loader)
        2. 选择 parameter.txt
        3. 选择 boot.img
        4. 选择 rootfs.img
        
        备注: dtb 目录下已保留单独生成的设备树文件。
        EOF

        cd "$FINAL_DIR"
        zip -q -r "../${FINAL_DIR}.zip" .
        cd ..
        echo "ZIP_NAME=${FINAL_DIR}.zip" >> "$GITHUB_ENV"
        ls -lh "$ZIP_NAME"

    - name: 9. 上传到 Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: build-${{ github.run_number }}-${DEVICE_MODEL}
        name: "Rockchip ${DEVICE_MODEL} Ubuntu 刷机包 (Kernel ${KERNEL_VERSION})"
        files: |
          ${{ env.ZIP_NAME }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
