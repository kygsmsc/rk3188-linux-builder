name: 编译 Rockchip 刷机包 (RK3188 三发行版)

on:
  workflow_dispatch:
    inputs:
      device_model:
        description: '设备型号'
        required: true
        type: choice
        options: [rk3188, rk3288]
        default: 'rk3188'
      board:
        description: '板型（对应 dts 文件名，不含 .dts）'
        required: true
        default: 'rk3188-adesk-std'
      kernel_version:
        description: '内核版本'
        required: true
        default: '6.12.116'
      distros:
        description: '要构建的发行版（逗号分隔：ubuntu,debian,armbian）'
        required: true
        default: 'ubuntu,debian,armbian'
      ubuntu_version:
        description: 'Ubuntu Base 版本'
        required: false
        type: choice
        options: ['20.04.5', '22.04.5', '24.04.5']
        default: '22.04.5'
      debian_suite:
        description: 'Debian 代号'
        required: false
        type: choice
        options: ['bookworm', 'trixie']
        default: 'bookworm'
      armbian_board:
        description: 'Armbian 板型'
        required: false
        default: 'rock-5b'
      armbian_release:
        description: 'Armbian 发行代号'
        required: false
        type: choice
        options: ['bookworm', 'trixie']
        default: 'bookworm'
      armbian_branch:
        description: 'Armbian 分支'
        required: false
        type: choice
        options: ['current', 'edge', 'vendor', 'legacy']
        default: 'legacy'
      base_url:
        description: 'Ubuntu Base 下载根前缀（留空则自动用 codename 拼完整）'
        required: false
        default: ''
      mirror:
        description: 'apt 软件源镜像（Ubuntu）'
        required: false
        default: 'http://repo.huaweicloud.com/ubuntu-ports'
      debian_mirror:
        description: 'Debian 软件源镜像'
        required: false
        default: 'https://mirrors.aliyun.com/debian'
      root_password:
        description: 'root 登录密码'
        required: false
        default: 'root123'
      custom_mac:
        description: '自定义 eth0 MAC（留空用原生）'
        required: false
        default: ''
      minimal_mode:
        description: 'C 级精简（yes = 移除 htop/bash-completion/rsyslog）'
        required: false
        type: choice
        options: ['no', 'yes']
        default: 'no'
      rootfs_size:
        description: 'rootfs.img 最小大小'
        required: true
        default: '2G'

permissions:
  contents: write

jobs:
  # ============================================================
  # 准备矩阵：把 inputs.distros 拆成矩阵
  # 关键：Ubuntu 的 codename 必须是代号（jammy/focal/noble），不能是版本号
  # ============================================================
  prepare-matrix:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          set -euo pipefail

          # Ubuntu 版本 → 代号
          UV="${{ inputs.ubuntu_version }}"
          case "$UV" in
            20.04.*) UCODENAME="focal" ;;
            22.04.*) UCODENAME="jammy" ;;
            24.04.*) UCODENAME="noble" ;;
            *)       UCODENAME="jammy" ;;
          esac

          DISTROS="${{ inputs.distros }}"
          MATRIX="[]"
          IFS=',' read -ra ARR <<< "$DISTROS"
          for d in "${ARR[@]}"; do
            d=$(echo "$d" | xargs)
            case "$d" in
              ubuntu)
                MATRIX=$(echo "$MATRIX" | jq -c --arg c "$UCODENAME" \
                  '. + [{
                    "distro":"ubuntu",
                    "codename":$c,
                    "debian_suite":"bookworm",
                    "armbian_board":"rock-5b",
                    "armbian_release":"bookworm",
                    "armbian_branch":"legacy"
                  }]')
                ;;
              debian)
                MATRIX=$(echo "$MATRIX" | jq -c --arg c "${{ inputs.debian_suite }}" \
                  '. + [{
                    "distro":"debian",
                    "codename":$c,
                    "debian_suite":$c,
                    "armbian_board":"rock-5b",
                    "armbian_release":"bookworm",
                    "armbian_branch":"legacy"
                  }]')
                ;;
              armbian)
                MATRIX=$(echo "$MATRIX" | jq -c \
                  --arg board "${{ inputs.armbian_board }}" \
                  --arg release "${{ inputs.armbian_release }}" \
                  --arg branch "${{ inputs.armbian_branch }}" \
                  '. + [{
                    "distro":"armbian",
                    "codename":$release,
                    "debian_suite":"bookworm",
                    "armbian_board":$board,
                    "armbian_release":$release,
                    "armbian_branch":$branch
                  }]')
                ;;
              *) echo "⚠️ 未知 distro: $d";;
            esac
          done
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"
          echo "矩阵: $MATRIX"

  # ============================================================
  # 构建矩阵
  # ============================================================
  build-rockchip:
    needs: prepare-matrix
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    strategy:
      matrix:
        include: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
      fail-fast: false

    env:
      DEVICE_MODEL: ${{ inputs.device_model }}
      BOARD: ${{ inputs.board }}
      KERNEL_VERSION: ${{ inputs.kernel_version }}
      DISTRO: ${{ matrix.distro }}
      CODENAME: ${{ matrix.codename }}
      DEBIAN_SUITE: ${{ matrix.debian_suite }}
      ARMBIAN_BOARD: ${{ matrix.armbian_board }}
      ARMBIAN_RELEASE: ${{ matrix.armbian_release }}
      ARMBIAN_BRANCH: ${{ matrix.armbian_branch }}
      BASE_URL: ${{ inputs.base_url }}
      MIRROR: ${{ inputs.mirror }}
      DEBIAN_MIRROR: ${{ inputs.debian_mirror }}
      ROOT_PASSWORD: ${{ inputs.root_password }}
      CUSTOM_MAC: ${{ inputs.custom_mac }}
      MINIMAL_MODE: ${{ inputs.minimal_mode }}
      ROOTFS_SIZE: ${{ inputs.rootfs_size }}

    steps:
    - name: 1. 检出代码
      uses: actions/checkout@v4

    # ============================================================
    # 步骤 2：解析架构与 UBUNTU_ARCH（本地赋值 + GITHUB_ENV 双保险）
    # ============================================================
    - name: 2. 解析架构与工具链
      run: |
        set -euo pipefail

        ARCH=""
        CROSS_COMPILE=""
        KERNEL_IMAGE=""
        UBUNTU_ARCH=""
        QEMU_STATIC=""

        case "${DEVICE_MODEL}" in
          rk3188|rk3288)
            ARCH="arm"
            CROSS_COMPILE="arm-linux-gnueabihf-"
            KERNEL_IMAGE="zImage"
            UBUNTU_ARCH="armhf"
            QEMU_STATIC="qemu-arm-static"
            ;;
          *)
            ARCH="arm64"
            CROSS_COMPILE="aarch64-linux-gnu-"
            KERNEL_IMAGE="Image"
            UBUNTU_ARCH="arm64"
            QEMU_STATIC="qemu-aarch64-static"
            ;;
        esac

        {
          echo "ARCH=${ARCH}"
          echo "CROSS_COMPILE=${CROSS_COMPILE}"
          echo "KERNEL_IMAGE=${KERNEL_IMAGE}"
          echo "UBUNTU_ARCH=${UBUNTU_ARCH}"
          echo "QEMU_STATIC=${QEMU_STATIC}"
        } >> "$GITHUB_ENV"

        echo "✅ DISTRO=${DISTRO} ARCH=${ARCH} UBUNTU_ARCH=${UBUNTU_ARCH} CODENAME=${CODENAME}"

    # ============================================================
    # 步骤 3：安装依赖
    #   - debian-archive-keyring：修 Debian NO_PUBKEY
    #   - mmdebstrap / binfmt-support：Debian 构建
    #   - jq：矩阵生成
    # ============================================================
    - name: 3. 安装编译与打包依赖
      run: |
        set -euo pipefail
        sudo apt-get update -qq
        sudo apt-get install -y -qq \
          build-essential flex bison libssl-dev libelf-dev bc rsync \
          qemu-user-static e2fsprogs zip xz-utils kpartx android-sdk-libsparse-utils \
          gcc-arm-linux-gnueabihf libc6-i386 device-tree-compiler \
          mmdebstrap binfmt-support jq \
          debian-archive-keyring

    # ============================================================
    # 步骤 4：缓存 rootfs
    # ============================================================
    - name: 4. 缓存 rootfs
      uses: actions/cache@v4
      with:
        path: cache/*
        key: rootfs-${{ matrix.distro }}-${{ matrix.codename }}-${{ env.UBUNTU_ARCH }}
        restore-keys: |
          rootfs-${{ matrix.distro }}-${{ matrix.codename }}-
          rootfs-${{ matrix.distro }}-

    # ============================================================
    # 步骤 5：构建纯净 rootfs
    #   - BASE_URL 留空时由 common.sh 用 CODENAME 拼完整路径
    #   - UBUNTU_CODENAME 必须是代号（jammy/focal/noble）
    # ============================================================
    - name: 5. 构建纯净 rootfs
      run: |
        set -euo pipefail
        export MODE=usb
        export ROOTFS_DIR="$PWD/usb_pure_rootfs"
        export TARGET_HOSTNAME="${DEVICE_MODEL}"
        export DISTRO="${DISTRO}"
        export UBUNTU_VERSION="${CODENAME}"
        export UBUNTU_ARCH="${UBUNTU_ARCH}"
        export UBUNTU_CODENAME="${CODENAME}"
        export DEBIAN_SUITE="${DEBIAN_SUITE}"
        export DEBIAN_MIRROR="${DEBIAN_MIRROR}"
        export DEBIAN_ARCH="${UBUNTU_ARCH}"
        export ARMBIAN_BOARD="${ARMBIAN_BOARD}"
        export ARMBIAN_RELEASE="${ARMBIAN_RELEASE}"
        export ARMBIAN_BRANCH="${ARMBIAN_BRANCH}"
        export MIRROR="${MIRROR}"
        export MINIMAL_MODE="${MINIMAL_MODE}"
        export ROOT_PASSWORD="${ROOT_PASSWORD}"
        export CUSTOM_MAC="${CUSTOM_MAC}"

        # BASE_URL 仅在用户显式传入时才导出；否则 common.sh 自动拼
        if [ -n "${BASE_URL:-}" ]; then
          export BASE_URL
        fi

        chmod +x build_rootfs.sh lib/*.sh
        sudo -E ./build_rootfs.sh

    # ============================================================
    # 步骤 6：编译内核 / DTB / 模块
    # ============================================================
    - name: 6. 编译内核、DTS 与模块
      run: |
        set -euo pipefail
        KERNEL_MAJOR=$(echo "${KERNEL_VERSION}" | cut -d. -f1)
        KERNEL_TARBALL="linux-${KERNEL_VERSION}.tar.xz"
        wget -q --show-progress "https://cdn.kernel.org/pub/linux/kernel/v${KERNEL_MAJOR}.x/${KERNEL_TARBALL}" -O "${KERNEL_TARBALL}"
        tar xf "${KERNEL_TARBALL}"
        cd "linux-${KERNEL_VERSION}"

        cp "$GITHUB_WORKSPACE/configs/rk3188_defconfig" "arch/${ARCH}/configs/rk3188_defconfig"
        make ARCH="${ARCH}" CROSS_COMPILE="${CROSS_COMPILE}" rk3188_defconfig

        for sym in \
          CONFIG_OF_EARLY_FLATTREE CONFIG_DEVTMPFS CONFIG_BLK_DEV_INITRD \
          CONFIG_ARM_APPENDED_DTB CONFIG_ARM_ATAG_DTB_COMPAT CONFIG_SERIAL_EARLYCON \
          CONFIG_PARTITION_ADVANCED CONFIG_CMDLINE_PARTITION \
          CONFIG_MMC_DW_ROCKCHIP CONFIG_EXT4_FS CONFIG_EXT4_FS_POSIX_ACL CONFIG_DW_WATCHDOG ; do
          scripts/config --enable "$sym"
        done
        scripts/config --enable  CONFIG_ARM_ATAG_DTB_COMPAT_CMDLINE_FROM_BOOTLOADER
        scripts/config --disable CONFIG_ARM_ATAG_DTB_COMPAT_CMDLINE_EXTEND

        make ARCH="${ARCH}" CROSS_COMPILE="${CROSS_COMPILE}" olddefconfig

        echo "===== 关键符号校验 ====="
        for sym in CONFIG_PARTITION_ADVANCED CONFIG_MMC_DW_ROCKCHIP CONFIG_EXT4_FS; do
          grep -q "^${sym}=y" .config || { echo "❌ ${sym} 未启用"; exit 1; }
          echo "  ✅ ${sym}=y"
        done

        mkdir -p "arch/${ARCH}/boot/dts/rockchip"
        cp "$GITHUB_WORKSPACE/dts/"*.dts "arch/${ARCH}/boot/dts/rockchip/"

        make ARCH="${ARCH}" CROSS_COMPILE="${CROSS_COMPILE}" -j"$(nproc)" "${KERNEL_IMAGE}"
        make ARCH="${ARCH}" CROSS_COMPILE="${CROSS_COMPILE}" -j"$(nproc)" dtbs
        make ARCH="${ARCH}" CROSS_COMPILE="${CROSS_COMPILE}" -j"$(nproc)" modules
        make ARCH="${ARCH}" CROSS_COMPILE="${CROSS_COMPILE}" -j"$(nproc)" "rockchip/${BOARD}.dtb"

        sudo make ARCH="${ARCH}" CROSS_COMPILE="${CROSS_COMPILE}" \
          INSTALL_MOD_PATH="$GITHUB_WORKSPACE/usb_pure_rootfs" modules_install
        sudo chroot "$GITHUB_WORKSPACE/usb_pure_rootfs" /bin/bash -c 'depmod -a 2>/dev/null || true' || true

        mkdir -p "$GITHUB_WORKSPACE/dtb_out"
        find "arch/${ARCH}/boot/dts" -name "*.dtb" -exec cp {} "$GITHUB_WORKSPACE/dtb_out/" \;
        cp "arch/${ARCH}/boot/${KERNEL_IMAGE}" "$GITHUB_WORKSPACE/${KERNEL_IMAGE}"

        test -f "$GITHUB_WORKSPACE/dtb_out/${BOARD}.dtb" || { echo "❌ 找不到 ${BOARD}.dtb"; exit 1; }
        echo "✅ 内核与 dtb 编译完成"

    # ============================================================
    # 步骤 7：打包刷机镜像
    # ============================================================
    - name: 7. 打包刷机镜像
      run: |
        set -euo pipefail
        FINAL_DIR="rk-flash-${DEVICE_MODEL}-${DISTRO}-${CODENAME}-K${KERNEL_VERSION}"
        mkdir -p "$FINAL_DIR"

        ROOTFS_MB=$(sudo du -sm usb_pure_rootfs | cut -f1)
        IMG_MB=$(( ROOTFS_MB * 130 / 100 ))
        [ "$IMG_MB" -lt 2048 ] && IMG_MB=2048
        echo "rootfs 实际 ${ROOTFS_MB}MB，镜像 ${IMG_MB}MB"

        truncate -s "${IMG_MB}M" "$FINAL_DIR/rootfs.img"
        mkfs.ext4 -F -L rootfs "$FINAL_DIR/rootfs.img"
        mkdir -p mnt_rootfs
        sudo mount -o loop "$FINAL_DIR/rootfs.img" mnt_rootfs
        sudo cp -a usb_pure_rootfs/. mnt_rootfs/
        sync
        sudo umount mnt_rootfs
        rmdir mnt_rootfs
        e2fsck -p -f "$FINAL_DIR/rootfs.img" || true
        echo "✅ rootfs.img: $(stat -c%s "$FINAL_DIR/rootfs.img") 字节"

        mkdir -p "$FINAL_DIR/dtb"
        cp dtb_out/*.dtb "$FINAL_DIR/dtb/"
        DTB_FILE="dtb_out/${BOARD}.dtb"
        test -f "$DTB_FILE" || { echo "❌ 找不到 $DTB_FILE"; exit 1; }

        cat "${KERNEL_IMAGE}" "$DTB_FILE" > zImage-dtb

        CMDLINE_BOOT="earlyprintk console=ttyS2,115200 root=/dev/mmcblk1p1 rootfstype=ext4 rw rootwait init=/sbin/init maxcpus=1"
        rm -rf mkbootimg-src
        git clone --depth 1 https://github.com/neo-technologies/rockchip-mkbootimg.git mkbootimg-src
        make -C mkbootimg-src
        ./mkbootimg-src/mkbootimg \
          --kernel zImage-dtb \
          --cmdline "$CMDLINE_BOOT" \
          -o "$FINAL_DIR/boot.img"
        echo "✅ boot.img: $(stat -c%s "$FINAL_DIR/boot.img") 字节"

        if [ -f "$GITHUB_WORKSPACE/inspect_rk_img.sh" ]; then
          chmod +x "$GITHUB_WORKSPACE/inspect_rk_img.sh"
          "$GITHUB_WORKSPACE/inspect_rk_img.sh" "$FINAL_DIR/boot.img" \
            | tee "$FINAL_DIR/boot-inspect.txt"
        fi

        cp "$GITHUB_WORKSPACE/parameter.txt" "$FINAL_DIR/parameter.txt"

        cat > "$FINAL_DIR/wipe-emmc.sh" << 'EOF'
        #!/bin/bash
        # 刷机前擦除 eMMC 前 1MiB（MBR + 原厂 Android 分区表）
        set -e
        DEV=/dev/mmcblk1
        echo "⚠️  即将擦除 $DEV 前 1MiB，按 Ctrl+C 取消"
        sleep 3
        dd if=/dev/zero of=$DEV bs=1M count=1 conv=fsync
        sync
        echo "✅ eMMC 前 1MiB 已擦除，现在重启并用 RKDevTool 升级固件"
        EOF
        chmod +x "$FINAL_DIR/wipe-emmc.sh"

        cat > "$FINAL_DIR/README.txt" << EOF
        设备: ${DEVICE_MODEL}  板型: ${BOARD}
        发行版: ${DISTRO} (${CODENAME})
        内核: ${KERNEL_VERSION}  架构: ${UBUNTU_ARCH}

        ========== 刷机步骤 ==========
        1. 【必做】擦除 eMMC 旧分区表：
           方式 A：TTL 串口登录现有系统，执行 wipe-emmc.sh
           方式 B：RKDevTool → 高级功能 → 擦除 Flash → 全盘擦除
        2. RKDevTool 用 "升级固件" 模式（不是 "下载镜像"）：
           - loader（原厂）
           - parameter.txt
           - boot.img
           - rootfs.img
        3. 点击 "执行"，等待完成
        4. 串口 ttyS2 / 115200 查看启动日志

        ========== 验证成功标志 ==========
          Kernel command line: ... root=/dev/mmcblk1p1 ...
          mmcblk1p1: ... 3.5 GiB   （不是 2MiB！）
          EXT4-fs (mmcblk1p1): mounted filesystem
          Run /sbin/init as init process

        ========== 账号 ==========
        root 密码: ${ROOT_PASSWORD}
        EOF

        ZIP_NAME="${FINAL_DIR}.zip"
        cd "$FINAL_DIR"
        zip -q -r "../${ZIP_NAME}" .
        cd ..
        echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"

    # ============================================================
    # 步骤 8：上传 Release
    # ============================================================
    - name: 8. 上传到 Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: build-${{ github.run_number }}-${{ matrix.distro }}-${{ matrix.codename }}
        name: "RK3188 ${{ matrix.distro }} ${{ matrix.codename }} (Kernel ${{ inputs.kernel_version }}) - ${{ inputs.board }}"
        files: |
          ${{ env.ZIP_NAME }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
