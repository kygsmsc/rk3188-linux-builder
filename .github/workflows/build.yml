name: 编译 Rockchip 刷机包 (RK3188 三发行版)

on:
  workflow_dispatch:
    inputs:
      device_model:
        description: '设备型号'
        required: true
        type: choice
        options: [rk3188, rk3288]
        default: 'rk3188'
      board:
        description: '板型（对应 dts 文件名，不含 .dts）'
        required: true
        default: 'rk3188-adesk-std'
      kernel_version:
        description: '内核版本'
        required: true
        default: '6.12.116'
      distros:
        description: '要构建的发行版（逗号分隔：ubuntu,debian,armbian）'
        required: true
        default: 'ubuntu,debian,armbian'
      ubuntu_version:
        description: 'Ubuntu Base 版本'
        required: false
        type: choice
        options: ['20.04.5', '22.04.5', '24.04.5']
        default: '22.04.5'
      debian_suite:
        description: 'Debian 代号'
        required: false
        type: choice
        options: ['bookworm', 'trixie']
        default: 'bookworm'
      armbian_board:
        description: 'Armbian 板型'
        required: false
        default: 'rock-5b'
      armbian_release:
        description: 'Armbian 发行代号（rock-5b 只有 trixie/resolute）'
        required: false
        type: choice
        options: ['trixie', 'resolute', 'bookworm']
        default: 'trixie'
      armbian_branch:
        description: 'Armbian 分支'
        required: false
        type: choice
        options: ['current', 'edge', 'vendor', 'legacy']
        default: 'legacy'
      base_url:
        description: 'Ubuntu Base 下载根前缀（留空则自动用 codename 拼完整）'
        required: false
        default: ''
      mirror:
        description: 'apt 软件源镜像（Ubuntu）'
        required: false
        default: 'http://repo.huaweicloud.com/ubuntu-ports'
      debian_mirror:
        description: 'Debian 软件源镜像'
        required: false
        default: 'https://mirrors.aliyun.com/debian'
      root_password:
        description: 'root 登录密码'
        required: false
        default: 'root123'
      custom_mac:
        description: '自定义 eth0 MAC（留空用原生）'
        required: false
        default: ''
      minimal_mode:
        description: 'C 级精简（yes = 移除 htop/bash-completion/rsyslog）'
        required: false
        type: choice
        options: ['no', 'yes']
        default: 'no'
      rootfs_size:
        description: 'rootfs.img 最小大小（1G / 1024M / 纯数字按 MiB；实际取 max(内容×1.3, 本值)，硬下限 1024M）'
        required: false
        default: '1G'

permissions:
  contents: write

jobs:
  # ============================================================
  # 准备矩阵：把 inputs.distros 拆成矩阵
  # 关键：Ubuntu 的 codename 必须是代号（jammy/focal/noble），不能是版本号
  # ============================================================
  prepare-matrix:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          set -euo pipefail

          # Ubuntu 版本 → 代号
          UV="${{ inputs.ubuntu_version }}"
          case "$UV" in
            20.04.*) UCODENAME="focal" ;;
            22.04.*) UCODENAME="jammy" ;;
            24.04.*) UCODENAME="noble" ;;
            *)       UCODENAME="jammy" ;;
          esac

          DISTROS="${{ inputs.distros }}"
          MATRIX="[]"
          IFS=',' read -ra ARR <<< "$DISTROS"
          for d in "${ARR[@]}"; do
            d=$(echo "$d" | xargs)
            case "$d" in
              ubuntu)
                MATRIX=$(echo "$MATRIX" | jq -c --arg c "$UCODENAME" \
                  '. + [{
                    "distro":"ubuntu",
                    "codename":$c,
                    "debian_suite":"bookworm",
                    "armbian_board":"rock-5b",
                    "armbian_release":"bookworm",
                    "armbian_branch":"legacy"
                  }]')
                ;;
              debian)
                MATRIX=$(echo "$MATRIX" | jq -c --arg c "${{ inputs.debian_suite }}" \
                  '. + [{
                    "distro":"debian",
                    "codename":$c,
                    "debian_suite":$c,
                    "armbian_board":"rock-5b",
                    "armbian_release":"bookworm",
                    "armbian_branch":"legacy"
                  }]')
                ;;
              armbian)
                MATRIX=$(echo "$MATRIX" | jq -c \
                  --arg board "${{ inputs.armbian_board }}" \
                  --arg release "${{ inputs.armbian_release }}" \
                  --arg branch "${{ inputs.armbian_branch }}" \
                  '. + [{
                    "distro":"armbian",
                    "codename":$release,
                    "debian_suite":"bookworm",
                    "armbian_board":$board,
                    "armbian_release":$release,
                    "armbian_branch":$branch
                  }]')
                ;;
              *) echo "⚠️ 未知 distro: $d";;
            esac
          done
          echo "matrix=${MATRIX}" >> "$GITHUB_OUTPUT"
          echo "矩阵: $MATRIX"

  # ============================================================
  # 构建矩阵
  # ============================================================
  build-rockchip:
    needs: prepare-matrix
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    strategy:
      matrix:
        include: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
      fail-fast: false

    env:
      DEVICE_MODEL: ${{ inputs.device_model }}
      BOARD: ${{ inputs.board }}
      KERNEL_VERSION: ${{ inputs.kernel_version }}
      DISTRO: ${{ matrix.distro }}
      CODENAME: ${{ matrix.codename }}
      DEBIAN_SUITE: ${{ matrix.debian_suite }}
      ARMBIAN_BOARD: ${{ matrix.armbian_board }}
      ARMBIAN_RELEASE: ${{ matrix.armbian_release }}
      ARMBIAN_BRANCH: ${{ matrix.armbian_branch }}
      BASE_URL: ${{ inputs.base_url }}
      MIRROR: ${{ inputs.mirror }}
      DEBIAN_MIRROR: ${{ inputs.debian_mirror }}
      ROOT_PASSWORD: ${{ inputs.root_password }}
      CUSTOM_MAC: ${{ inputs.custom_mac }}
      MINIMAL_MODE: ${{ inputs.minimal_mode }}
      ROOTFS_SIZE: ${{ inputs.rootfs_size }}

    steps:
    - name: 1. 检出代码
      uses: actions/checkout@v4

    # ============================================================
    # 步骤 2：解析架构与 UBUNTU_ARCH（本地赋值 + GITHUB_ENV 双保险）
    # ============================================================
    - name: 2. 解析架构与工具链
      run: |
        set -euo pipefail

        ARCH=""
        CROSS_COMPILE=""
        KERNEL_IMAGE=""
        UBUNTU_ARCH=""
        QEMU_STATIC=""

        case "${DEVICE_MODEL}" in
          rk3188|rk3288)
            ARCH="arm"
            CROSS_COMPILE="arm-linux-gnueabihf-"
            KERNEL_IMAGE="zImage"
            UBUNTU_ARCH="armhf"
            QEMU_STATIC="qemu-arm-static"
            ;;
          *)
            ARCH="arm64"
            CROSS_COMPILE="aarch64-linux-gnu-"
            KERNEL_IMAGE="Image"
            UBUNTU_ARCH="arm64"
            QEMU_STATIC="qemu-aarch64-static"
            ;;
        esac

        {
          echo "ARCH=${ARCH}"
          echo "CROSS_COMPILE=${CROSS_COMPILE}"
          echo "KERNEL_IMAGE=${KERNEL_IMAGE}"
          echo "UBUNTU_ARCH=${UBUNTU_ARCH}"
          echo "QEMU_STATIC=${QEMU_STATIC}"
        } >> "$GITHUB_ENV"

        echo "✅ DISTRO=${DISTRO} ARCH=${ARCH} UBUNTU_ARCH=${UBUNTU_ARCH} CODENAME=${CODENAME}"

    # ============================================================
    # 步骤 3：安装依赖
    #   - debian-archive-keyring：修 Debian NO_PUBKEY
    #   - mmdebstrap / binfmt-support：Debian 构建
    #   - jq：矩阵生成
    # ============================================================
    - name: 3. 安装编译与打包依赖
      run: |
        set -euo pipefail
        sudo apt-get update -qq
        sudo apt-get install -y -qq \
          build-essential flex bison libssl-dev libelf-dev bc rsync \
          qemu-user-static e2fsprogs zip xz-utils kpartx android-sdk-libsparse-utils \
          gcc-arm-linux-gnueabihf libc6-i386 device-tree-compiler \
          mmdebstrap binfmt-support jq \
          debian-archive-keyring

    # ============================================================
    # 步骤 4：缓存 rootfs
    # ============================================================
    - name: 4. 缓存 rootfs
      uses: actions/cache@v4
      with:
        path: cache/*
        key: rootfs-${{ matrix.distro }}-${{ matrix.codename }}-${{ env.UBUNTU_ARCH }}
        restore-keys: |
          rootfs-${{ matrix.distro }}-${{ matrix.codename }}-
          rootfs-${{ matrix.distro }}-

    # ============================================================
    # 步骤 5：构建纯净 rootfs
    #   - BASE_URL 留空时由 common.sh 用 CODENAME 拼完整路径
    #   - UBUNTU_CODENAME 必须是代号（jammy/focal/noble）
    # ============================================================
    - name: 5. 构建纯净 rootfs
      run: |
        set -euo pipefail
        export MODE=usb
        export ROOTFS_DIR="$PWD/usb_pure_rootfs"
        export TARGET_HOSTNAME="${DEVICE_MODEL}"
        export DISTRO="${DISTRO}"
        export UBUNTU_VERSION="${CODENAME}"
        export UBUNTU_ARCH="${UBUNTU_ARCH}"
        export UBUNTU_CODENAME="${CODENAME}"
        export DEBIAN_SUITE="${DEBIAN_SUITE}"
        export DEBIAN_MIRROR="${DEBIAN_MIRROR}"
        export DEBIAN_ARCH="${UBUNTU_ARCH}"
        export ARMBIAN_BOARD="${ARMBIAN_BOARD}"
        export ARMBIAN_RELEASE="${ARMBIAN_RELEASE}"
        export ARMBIAN_BRANCH="${ARMBIAN_BRANCH}"
        export MIRROR="${MIRROR}"
        export MINIMAL_MODE="${MINIMAL_MODE}"
        export ROOT_PASSWORD="${ROOT_PASSWORD}"
        export CUSTOM_MAC="${CUSTOM_MAC}"

        # BASE_URL 仅在用户显式传入时才导出；否则 common.sh 自动拼
        if [ -n "${BASE_URL:-}" ]; then
          export BASE_URL
        fi

        chmod +x build_rootfs.sh lib/*.sh
        sudo -E ./build_rootfs.sh

    # ============================================================
    # 步骤 6：编译内核 / DTB / 模块
    # ============================================================
    - name: 6. 编译内核、DTS 与模块
      run: |
        set -euo pipefail
        KERNEL_MAJOR=$(echo "${KERNEL_VERSION}" | cut -d. -f1)
        KERNEL_TARBALL="linux-${KERNEL_VERSION}.tar.xz"
        wget -q --show-progress "https://cdn.kernel.org/pub/linux/kernel/v${KERNEL_MAJOR}.x/${KERNEL_TARBALL}" -O "${KERNEL_TARBALL}"
        tar xf "${KERNEL_TARBALL}"
        cd "linux-${KERNEL_VERSION}"

        cp "$GITHUB_WORKSPACE/configs/rk3188_defconfig" "arch/${ARCH}/configs/rk3188_defconfig"
        make ARCH="${ARCH}" CROSS_COMPILE="${CROSS_COMPILE}" rk3188_defconfig

        # ========================================================
        # 【修改点 C1】内核配置：命令行分区解析器必须真的编进内核
        #
        # 依据（6.12.116 源码，block/partitions/Kconfig）：
        #   config PARTITION_ADVANCED
        #       bool "Advanced partition selection"
        #   config CMDLINE_PARTITION
        #       bool "Command line partition support" if PARTITION_ADVANCED
        #       help  "Say Y here if you want to read the partition table from bootargs."
        #   config OF_PARTITION
        #       bool "Device Tree partition support" if PARTITION_ADVANCED
        # 且 block/partitions/Makefile 里只有 obj-$(CONFIG_CMDLINE_PARTITION) += cmdline.o。
        #
        # 参考配置 config-5.10.27-rk3188 第 728 行是
        #   "# CONFIG_PARTITION_ADVANCED is not set"
        # 它里面的老符号 CONFIG_BLK_CMDLINE_PARSER=y（5.10 叫 blkdevparts 的开关，
        # 见 block/partitions/cmdline.c 的 __setup("blkdevparts=")）在 6.12 里已经
        # 改名成 CONFIG_CMDLINE_PARTITION，olddefconfig 不会自动帮你迁移，
        # 必须显式打开 —— 这就是 eMMC 上"没有 MBR 也没有分区"的根因所在。
        # ========================================================
        for sym in \
          CONFIG_OF_EARLY_FLATTREE CONFIG_DEVTMPFS CONFIG_BLK_DEV_INITRD \
          CONFIG_ARM_APPENDED_DTB CONFIG_ARM_ATAG_DTB_COMPAT CONFIG_SERIAL_EARLYCON \
          CONFIG_PARTITION_ADVANCED CONFIG_CMDLINE_PARTITION \
          CONFIG_MMC_DW_ROCKCHIP CONFIG_EXT4_FS CONFIG_EXT4_FS_POSIX_ACL CONFIG_DW_WATCHDOG ; do
          scripts/config --enable "$sym"
        done
        scripts/config --enable  CONFIG_ARM_ATAG_DTB_COMPAT_CMDLINE_FROM_BOOTLOADER
        scripts/config --disable CONFIG_ARM_ATAG_DTB_COMPAT_CMDLINE_EXTEND

        make ARCH="${ARCH}" CROSS_COMPILE="${CROSS_COMPILE}" olddefconfig

        # ========================================================
        # 【修改点 C2】兜底：不同版本的 scripts/config 在 .config 里找不到某个
        # 符号时行为不一致（有的直接报错、有的静默跳过），这里再按文本强制写一遍，
        # 然后重跑 olddefconfig 让依赖（PARTITION_ADVANCED → CMDLINE_PARTITION）
        # 正确落盘。多这一步成本近乎为零，但能避免"编译成功、分区却没有"的黑盒。
        # ========================================================
        for sym in CONFIG_PARTITION_ADVANCED CONFIG_CMDLINE_PARTITION; do
          sed -i "s/^# ${sym} is not set/${sym}=y/" .config
          grep -q "^${sym}=y" .config || echo "${sym}=y" >> .config
        done
        make ARCH="${ARCH}" CROSS_COMPILE="${CROSS_COMPILE}" olddefconfig

        echo "===== 关键符号校验 ====="
        # ========================================================
        # 【修改点 C3】上一版的校验只查了 CONFIG_PARTITION_ADVANCED，等于没查：
        # 真正决定 blkdevparts 是否生效的是 CONFIG_CMDLINE_PARTITION。
        # 这里把两个分区符号 + 启动链路必需符号一起校验，缺任何一个直接失败，
        # 不产出"注定 panic"的刷机包。
        # ========================================================
        # 第二十三轮追加：网口走 GPIO 模拟 MDIO（mdio-gpio），两个符号缺一个都会
        # 让 DTB 里的 mdio-gpio 节点无人认领 → eth0 永远不出现。
        for sym in CONFIG_PARTITION_ADVANCED CONFIG_CMDLINE_PARTITION \
                   CONFIG_MMC_DW_ROCKCHIP CONFIG_EXT4_FS CONFIG_DEVTMPFS \
                   CONFIG_ARM_ATAG_DTB_COMPAT_CMDLINE_FROM_BOOTLOADER \
                   CONFIG_ARC_EMAC_CORE CONFIG_MDIO_BITBANG CONFIG_MDIO_GPIO; do
          grep -q "^${sym}=y" .config || { echo "❌ ${sym} 未启用"; exit 1; }
          echo "  ✅ ${sym}=y"
        done
        grep -E "CONFIG_(PARTITION_ADVANCED|CMDLINE_PARTITION)=" .config

        mkdir -p "arch/${ARCH}/boot/dts/rockchip"
        cp "$GITHUB_WORKSPACE/dts/"*.dts "arch/${ARCH}/boot/dts/rockchip/"

        # ========================================================
        # 【第二十轮 RNG：给内核一份可信启动熵，修纯净启动静默卡死】
        #
        # 现象：纯 parameter.txt 启动（内核直接跑 /sbin/init）时，串口停在
        #   systemd[1]: Hostname set to <rk3188>.
        # 就再也不动，一个 unit 都没起，回车无反应；而 init=/bin/sh 之后再
        # exec /sbin/init（此时 uptime 已过 25~140 秒）却能一路到 login。
        #
        # 依据（6.12.116 源码，已逐行核对）：
        #   drivers/char/random.c:976
        #     void __init add_bootloader_randomness(const void *buf, size_t len)
        #     { mix_pool_bytes(buf, len); if (trust_bootloader) credit_init_bits(len * 8); }
        #   random.c 里 trust_bootloader / trust_cpu 的 __initdata 默认都是 true；
        #   drivers/of/fdt.c:early_init_dt_scan_chosen() 读 /chosen/rng-seed，
        #   调 add_bootloader_randomness()，随后 fdt_nop_property() 把种子抹掉。
        #   => DTB 里给 64 字节 rng-seed，内核在解析 DT 那一刻（远早于 init）
        #      就把 CRNG 初始化完成，systemd 的 getrandom() 不再阻塞。
        #
        # 为什么这台机器必须这么做：defconfig 里没有可用 HWRNG
        #   （CONFIG_HW_RANDOM=y 但只开了 OPTEE；Cortex-A9 也没有 RDRAND），
        #   RK3188 的 crypto 没有 mainline hwrng 驱动，冷启动只能靠中断抖动攒熵，
        #   2.7 秒的冷启动攒不够 256 bit，于是 PID1 就停在 getrandom 上等。
        #
        # 下面只改【拷进内核树的那份 dts】，仓库里的 dts 源文件保持干净可读；
        # 每次构建种子都不同（唯一残留弱点：同一份固件每次启动种子相同）。
        # ========================================================
        python3 - << 'PY'
        import glob, os, re, secrets

        # 注意：本 heredoc 用 << 'PY'（带引号），shell 不会展开 ${ARCH}，
        # 所以这里必须从环境变量取 ARCH，不能写 ${ARCH} 字面量。
        arch = os.environ.get("ARCH", "arm")
        board = os.environ["BOARD"]
        # 只处理我们自己的那块板：内核树的 arch/arm/boot/dts/rockchip/ 里本来
        # 自带几十个上游 dts（rk3036-evb.dts 之类），它们大多没有 chosen 节点，
        # 用 *.dts 通配会把它们一起扫进来并报错。这里精确到 BOARD 对应的文件。
        files = ["arch/" + arch + "/boot/dts/rockchip/" + board + ".dts"]
        if not os.path.isfile(files[0]):
            raise SystemExit("FAIL: missing dts in kernel tree: " + files[0])

        for path in files:
            text = open(path, encoding="utf-8").read()
            if "rng-seed" in text:
                print("  = already has rng-seed:", path)
                continue
            seed = " ".join("%02x" % b for b in secrets.token_bytes(64))
            new, n = re.subn(r"chosen\s*\{", "chosen {\n\t\trng-seed = [" + seed + "];", text, count=1)
            if n != 1:
                raise SystemExit("FAIL: no chosen node in " + path)
            open(path, "w", encoding="utf-8").write(new)
            print("  + injected 64-byte rng-seed into", path)

        for path in files:
            if "rng-seed = [" not in open(path, encoding="utf-8").read():
                raise SystemExit("FAIL: rng-seed injection verify failed for " + path)
        print("  OK: rng-seed injected and verified")
        PY

        make ARCH="${ARCH}" CROSS_COMPILE="${CROSS_COMPILE}" -j"$(nproc)" "${KERNEL_IMAGE}"
        make ARCH="${ARCH}" CROSS_COMPILE="${CROSS_COMPILE}" -j"$(nproc)" dtbs
        make ARCH="${ARCH}" CROSS_COMPILE="${CROSS_COMPILE}" -j"$(nproc)" modules
        make ARCH="${ARCH}" CROSS_COMPILE="${CROSS_COMPILE}" -j"$(nproc)" "rockchip/${BOARD}.dtb"

        sudo make ARCH="${ARCH}" CROSS_COMPILE="${CROSS_COMPILE}" \
          INSTALL_MOD_PATH="$GITHUB_WORKSPACE/usb_pure_rootfs" modules_install
        sudo chroot "$GITHUB_WORKSPACE/usb_pure_rootfs" /bin/bash -c 'depmod -a 2>/dev/null || true' || true

        mkdir -p "$GITHUB_WORKSPACE/dtb_out"
        find "arch/${ARCH}/boot/dts" -name "*.dtb" -exec cp {} "$GITHUB_WORKSPACE/dtb_out/" \;
        cp "arch/${ARCH}/boot/${KERNEL_IMAGE}" "$GITHUB_WORKSPACE/${KERNEL_IMAGE}"

        # 【修改点 C4】把编译出的 .config 带进产物，出问题可以第一现场核对
        # （上一轮排查"分区解析器到底有没有编进去"就是缺少这份实物证据）
        cp .config "$GITHUB_WORKSPACE/kernel.config"

        test -f "$GITHUB_WORKSPACE/dtb_out/${BOARD}.dtb" || { echo "❌ 找不到 ${BOARD}.dtb"; exit 1; }
        echo "✅ 内核与 dtb 编译完成"

        # 【第十轮·守卫】本机没有 SD/TF 卡槽：dts 里 &mmc0 必须是 disabled，
        # 且 aliases 必须保留 mmc1 = &emmc。
        # 理由：mmc 控制器编号由 aliases 决定（6.12 drivers/mmc/core/host.c：
        #   alias_id = of_alias_get_id(dev->of_node, "mmc"); index = alias_id），
        # eMMC 靠这条别名才固定是 mmc1 → /dev/mmcblk1。
        # 一旦有人把 mmc0 改回 okay（或删掉 mmc1 别名），eMMC 可能变成 mmcblk0，
        # 刷机后就是 "Cannot open root device /dev/mmcblk1p1"，白白烧一次 eMMC。
        # 注意这行的 "-"：它告诉 python 从 stdin 读脚本，dts 路径是 argv[1]。
        # 少了这个 "-"，python 会把 .dts 当成 python 脚本执行，报
        #   SyntaxError: invalid character '（' (U+FF08)  ← 注释里的全角括号
        python3 - "$GITHUB_WORKSPACE/dts/${BOARD}.dts" << 'PY'
        import re, sys
        src = open(sys.argv[1], encoding='utf-8').read()

        def node_body(text, token):
            m = re.search(r'&' + re.escape(token) + r'\s*\{', text)
            if not m:
                return None
            i = m.end() - 1
            depth = 0
            for j in range(i, len(text)):
                if text[j] == '{':
                    depth += 1
                elif text[j] == '}':
                    depth -= 1
                    if depth == 0:
                        return text[i + 1:j]
            return None

        sd = node_body(src, 'mmc0')
        assert sd is not None, '❌ dts 里找不到 &mmc0 节点'
        assert 'status = "disabled"' in sd, '❌ &mmc0 必须 disabled（本机无 SD/TF 卡槽）'
        print('  ✅ &mmc0 = disabled（本机无 SD/TF 卡槽）')

        em = node_body(src, 'emmc')
        assert em is not None, '❌ dts 里找不到 &emmc 节点'
        assert 'status = "okay"' in em, '❌ &emmc 必须 okay'
        assert 'non-removable' in em, '❌ &emmc 必须有 non-removable'
        print('  ✅ &emmc = okay + non-removable')

        m = re.search(r'aliases\s*\{', src)
        assert m, '❌ dts 里没有 aliases 节点'
        i = m.end() - 1
        depth = 0
        for j in range(i, len(src)):
            if src[j] == '{' : depth += 1
            elif src[j] == '}':
                depth -= 1
                if depth == 0:
                    aliases = src[i + 1:j]
                    break
        else:
            raise SystemExit('❌ aliases 节点括号不配对')
        assert re.search(r'mmc1\s*=\s*&emmc', aliases), \
            '❌ aliases 必须保留 mmc1 = &emmc（否则 eMMC 会变成 mmcblk0，root=/dev/mmcblk1p1 失效）'
        print('  ✅ aliases 保留 mmc1 = &emmc（eMMC 固定 /dev/mmcblk1）')
        PY

    # ============================================================
    # 步骤 7：打包刷机镜像
    # ============================================================
    - name: 7. 打包刷机镜像
      run: |
        set -euo pipefail
        FINAL_DIR="rk-flash-${DEVICE_MODEL}-${DISTRO}-${CODENAME}-K${KERNEL_VERSION}"
        mkdir -p "$FINAL_DIR"

        ROOTFS_MB=$(sudo du -sm usb_pure_rootfs | cut -f1)
        AUTO_MB=$(( ROOTFS_MB * 130 / 100 ))

        # 【第十二轮】把 workflow 输入 rootfs_size 接回来。
        # 之前这一项只被导出成 ROOTFS_SIZE 环境变量，**没有任何步骤读它**，
        # 所以界面上填 2G/3G 全部无效，镜像大小实际由下面两行算死：
        #   AUTO_MB = 内容 × 130%，再硬压到 >=1024MB
        # 现在：镜像 = max(内容×130%, 你填的最小值)，并保留 1024MB 硬下限。
        # 单位支持 G/M/K（可带 B），纯数字按 MiB 解释，留空则只用自动值。
        PARSE_MB=$(python3 - "${ROOTFS_SIZE:-}" <<'PYSIZE'
        import re, sys
        raw = (sys.argv[1] if len(sys.argv) > 1 else '').strip()
        if not raw:
            print(0)          # 没填 → 0 = 不参与比较
            raise SystemExit
        m = re.match(r'^([0-9]+(?:\.[0-9]+)?)\s*([KMGT]?)B?$', raw, re.I)
        if not m:
            print(-1)         # -1 = 格式错误
            raise SystemExit
        unit = (m.group(2) or 'M').upper()
        factor = {'K': 1 / 1024, 'M': 1, 'G': 1024, 'T': 1024 * 1024}[unit]
        print(int(float(m.group(1)) * factor))
        PYSIZE
        )
        if [ "$PARSE_MB" = "-1" ]; then
          echo "❌ inputs.rootfs_size 格式不对：'${ROOTFS_SIZE}'（示例：1G / 1536M / 1024）"
          exit 1
        fi

        IMG_MB=$AUTO_MB
        if [ "$PARSE_MB" -gt 0 ]; then
          [ "$PARSE_MB" -gt "$IMG_MB" ] && IMG_MB=$PARSE_MB
          echo "  输入 rootfs_size = ${ROOTFS_SIZE} → ${PARSE_MB} MiB（作为下限参与取大）"
        else
          echo "  输入 rootfs_size 为空 → 只用自动值"
        fi

        # 【修改点 F3】硬下限 1024MB：内容只有 289MB，做 2GiB 镜像纯属浪费，
        # 每次刷机多写 1GiB，刷写时间和中途被打断的概率都翻倍（这正是前几轮反复
        # 怀疑 "rootfs 没写进去" 的根源）。1024MB 对 289MB 仍有 3.5 倍余量。
        if [ "$IMG_MB" -lt 1024 ]; then
          if [ "$PARSE_MB" -gt 0 ] && [ "$PARSE_MB" -lt 1024 ]; then
            echo "  ⚠️ 你填的 ${PARSE_MB} MiB 低于硬下限，已按 1024 MiB 处理"
          fi
          IMG_MB=1024
        fi
        echo "rootfs 实际 ${ROOTFS_MB}MB → 自动 ${AUTO_MB}MB，镜像最终 ${IMG_MB}MB"

        truncate -s "${IMG_MB}M" "$FINAL_DIR/rootfs.img"
        mkfs.ext4 -F -L rootfs "$FINAL_DIR/rootfs.img"
        mkdir -p mnt_rootfs
        sudo mount -o loop "$FINAL_DIR/rootfs.img" mnt_rootfs
        sudo cp -a usb_pure_rootfs/. mnt_rootfs/
        sync
        sudo umount mnt_rootfs
        rmdir mnt_rootfs
        e2fsck -p -f "$FINAL_DIR/rootfs.img" || true
        echo "✅ rootfs.img: $(stat -c%s "$FINAL_DIR/rootfs.img") 字节"

        # ========================================================
        # 【修改点 E1】rootfs.img 有效性自检（第六轮新增）
        #
        # 第六轮实机日志（ttl-rz5）已经证明分区没问题：
        #   mmcblk1: p1(rootfs)            ← 分区建出来了
        #   b301 3846144 mmcblk1p1         ← 大小对（20MiB~盘尾）
        # 但紧接着：
        #   No filesystem could mount root, tried: ext4
        #   Kernel panic ... "/dev/mmcblk1p1" or unknown-block(179,1)
        # 这句和上一轮不是一回事：设备节点存在、ext4 已内建，是"这个分区里
        # 没有 ext4 超级块"。只有两种可能，必须分开：
        #   a) 产物里的 rootfs.img 本身坏了/没打进去  ← 本段自检在 CI 阶段就拦
        #   b) 镜像没问题，但刷机时 rootfs 那一行根本没写进 eMMC 的 0xA000
        #      （勾选漏了 / 文件路径还是旧的 / 用"升级固件"页只写了 loader）
        # ext4 关键位置：超级块在文件偏移 1024，s_magic 在 +0x38（0x53EF），
        # s_volume_name 在 +0x78（应为 rootfs）。
        # ========================================================
        python3 - "$FINAL_DIR/rootfs.img" "$IMG_MB" << 'PY'
        import os, sys
        path = sys.argv[1]
        expect_mb = int(sys.argv[2])
        with open(path, 'rb') as f:
            head = f.read(2048)
        magic = head[1024 + 0x38:1024 + 0x38 + 2]
        label = head[1024 + 0x78:1024 + 0x78 + 16].rstrip(b'\x00').decode('utf-8', 'replace')
        size_mb = os.path.getsize(path) / 1048576
        print('rootfs.img 大小      : %.1f MiB' % size_mb)
        print('rootfs.img ext4 魔数 : %s（应为 53ef）' % magic.hex())
        print('rootfs.img 卷标      : %r（应为 rootfs）' % label)
        assert magic == b'\x53\xef', 'rootfs.img 0x400+0x38 处不是 ext4 超级块（0x53EF）'
        assert label == 'rootfs', 'rootfs.img 卷标不是 rootfs（/etc/fstab 用 LABEL=rootfs 会挂错）'
        # 期望值来自本步骤算出的 IMG_MB（= max(内容×1.3, 输入 rootfs_size)，下限 1024），
        # 不再硬编码 1024 —— 否则输入 2G/3G 时这里反而会"校验通过"，掩盖输入失效。
        assert size_mb >= expect_mb, \
            'rootfs.img 只有 %.0f MiB，小于本步骤算出的 %d MiB（输入 rootfs_size 未生效？）' \
            % (size_mb, expect_mb)
        print('✅ rootfs.img 自检通过：是有效 ext4、卷标 rootfs、大小 %.0f MiB（预期 >= %d）'
              % (size_mb, expect_mb))
        PY
        echo "---- ext4 头信息（对照刷机后 blkid 应该一致）----"
        dumpe2fs -h "$FINAL_DIR/rootfs.img" 2>/dev/null \
          | grep -E "Filesystem volume name|Block count|Free blocks|Block size|Filesystem features" || true

        mkdir -p "$FINAL_DIR/dtb"
        cp dtb_out/*.dtb "$FINAL_DIR/dtb/"
        DTB_FILE="dtb_out/${BOARD}.dtb"
        test -f "$DTB_FILE" || { echo "❌ 找不到 $DTB_FILE"; exit 1; }

        cat "${KERNEL_IMAGE}" "$DTB_FILE" > zImage-dtb

        # ========================================================
        # 【修改点 D1】cmdline 只保留一个来源：parameter.txt
        #
        # 上一版在 workflow 里又手写了一份 CMDLINE_BOOT（root=/dev/mmcblk1p1，
        # 没有 blkdevparts），和 parameter.txt 里的 CMDLINE 是两处独立维护。
        # 实测教训：loader 真正传给内核的是 parameter.txt 的 CMDLINE（日志里
        # Kernel command line 与 parameter 一字不差，末尾还会被 loader 追加
        # bootver/firmware_ver），boot.img 头里的 cmdline 只用于自检。
        # 两处各写一份，改一处忘一处就出现"头里写了、实机没有"的假象。
        # 现在直接抽取 parameter.txt 的 CMDLINE，两边永远一致。
        # ========================================================
        CMDLINE_BOOT=$(grep -m1 '^CMDLINE:' "$GITHUB_WORKSPACE/parameter.txt" \
                       | sed -e 's/^CMDLINE:/ /' -e 's/^[[:space:]]*//')
        echo "参数文件 cmdline: ${CMDLINE_BOOT}"

        # ========================================================
        # 【修改点 D2】硬性校验：没有 blkdevparts / root= 没对准 p1，直接失败。
        # eMMC 上没有 MBR/GPT（ttl-rz4 日志 unknown-block(179,1) 已证明），
        # 缺了 blkdevparts 就必然复制上一轮那次 panic，没必要白刷一次。
        # ========================================================
        case "${CMDLINE_BOOT}" in
          *blkdevparts=mmcblk1:*\(rootfs\)*)
            echo "  ✅ CMDLINE 含 blkdevparts=mmcblk1:... (rootfs)" ;;
          *)
            echo "❌ parameter.txt 的 CMDLINE 缺少 blkdevparts=mmcblk1:-@24M(rootfs)"
            exit 1 ;;
        esac
        # 【第十轮·存储对齐】两轮实测（ttl-rz8/rz9）得到固定规律：
        #   工具写盘位置 = mtdparts 里 rootfs 的偏移 + boot 的偏移(0x2000 = 4MiB)
        #     声明 0xA000(20MiB) → 数据落 24MiB（ttl-rz8，且实机 mount 成功）
        #     声明 0xC000(24MiB) → 数据落 28MiB（ttl-rz9，从未挂载验证过）
        # 本轮把声明回到教程同款的 0xA000，数据落回唯一验证过的 24MiB，
        # 内核 blkdevparts 指向 24M：
        #     boot    0x2000..0xA000（4~20MiB，16MiB 容量）
        #     rootfs  声明 0xA000(20MiB) → 实际 24MiB
        #     blkdevparts @24M = 实际落点 = p1 起点（声明/实际/内核一条线）
        # 校验式：bp 字节数 == (mtdparts 偏移 ×512) + 4MiB，三处漏一处就失败。
        python3 - "$GITHUB_WORKSPACE/parameter.txt" << 'PYCHK'
        import re, sys
        txt = open(sys.argv[1], encoding='utf-8', errors='replace').read()
        cm = [l for l in txt.splitlines() if l.startswith('CMDLINE:')][0]
        mb = re.search(r'blkdevparts=mmcblk1:[^ ]*', cm)
        mt = re.search(r'-\s?@(0x[0-9A-Fa-f]+)\(rootfs\)', cm)
        assert mb, 'CMDLINE 缺 blkdevparts=mmcblk1:...'
        assert mt, 'CMDLINE 缺 mtdparts 的 -@0x........(rootfs)'
        m = re.search(r'@(\d+)M', mb.group(0))
        assert m, 'blkdevparts 的 rootfs 起点必须是 <数字>M 形式'
        bp = int(m.group(1)) * 1024 * 1024
        mtb = int(mt.group(1), 16) * 512
        expect = mtb + 4 * 1024 * 1024          # 工具会额外加上 boot 基址 0x2000（4MiB）
        if bp != expect:
            sys.exit('❌ blkdevparts 起点 %d MiB 与 mtdparts %d MiB 不匹配：'
                     '按实测规则应为 %d MiB（= mtdparts + 4MiB）'
                     % (bp >> 20, mtb >> 20, expect >> 20))
        print('  ✅ blkdevparts rootfs 起点 = %d MiB（mtdparts %d MiB + 工具 4MiB）'
              % (bp >> 20, mtb >> 20))
        PYCHK
        case "${CMDLINE_BOOT}" in
          *root=/dev/mmcblk1p1*)
            echo "  ✅ CMDLINE root=/dev/mmcblk1p1（与 blkdevparts 建出的 rootfs=p1 对应）" ;;
          *)
            echo "❌ root= 必须与 blkdevparts 建出的分区号一致（本方案 rootfs 是 p1）"
            exit 1 ;;
        esac

        # 【ttl-rz10 修正】主刷 boot.img 是纯内核（ramdisk_size=0），CMDLINE 里
        # **绝不能**再有 initrd=。留着它，loader 会在 0x62000000 上交给内核一段
        # 192K 的残留垃圾，内核 "Trying to unpack rootfs image as initramfs" →
        # "junk within compressed archive" → 跳过挂根 → Run /init（ENOENT）→
        # Run /sbin/init（ENOENT）→ panic。rz10 就是这个死法。
        case "${CMDLINE_BOOT}" in
          *initrd=*)
            echo "❌ 主刷 parameter 的 CMDLINE 里不该有 initrd=（boot.img 没有 ramdisk，会把垃圾当 initramfs 解）"
            echo "   要用 initrd= 请刷 boot-rescue.img 并改用 parameter-rescue.txt"
            exit 1 ;;
          *)
            echo "  ✅ CMDLINE 无 initrd=（与纯内核 boot.img 匹配，内核会直接挂根）" ;;
        esac

        # 救援参数（只给 boot-rescue.img 用）：仓库里有就校验，没有就由主参数派生。
        # 之前这里写成"没有就失败"，会逼着仓库多维护一份容易漂移的文件；
        # 救援件本来就是可选的诊断件，改成派生更稳：
        #   parameter-rescue.txt = parameter.txt + 在 init=/sbin/init 后插回 initrd=
        RESCUE_PARAM="${GITHUB_WORKSPACE}/parameter-rescue.txt"
        if [ -f "$RESCUE_PARAM" ]; then
          RESCUE_CMDLINE=$(grep -m1 '^CMDLINE:' "$RESCUE_PARAM" | sed 's/^CMDLINE://')
          case "$RESCUE_CMDLINE" in
            *initrd=0x62000000,*)
              echo "  ✅ 仓库自带 parameter-rescue.txt，且含 initrd=0x62000000（供 boot-rescue.img 使用）" ;;
            *)
              echo "❌ 仓库里的 parameter-rescue.txt 缺 initrd=0x62000000,0x00800000（删掉它就用自动派生的）"
              exit 1 ;;
          esac
          case "$RESCUE_CMDLINE" in
            *blkdevparts=mmcblk1:*rootfs*) : ;;
            *) echo "❌ 仓库里的 parameter-rescue.txt 与主参数 blkdevparts 不一致"; exit 1 ;;
          esac
        else
          echo "  ⚠️ 仓库未提供 parameter-rescue.txt → 产物里用 parameter.txt 自动派生（只影响 boot-rescue.img）"
        fi
        [ "${#CMDLINE_BOOT}" -le 500 ] \
          || { echo "❌ CMDLINE ${#CMDLINE_BOOT} 字节，超过 boot.img 头 512 字节上限"; exit 1; }

        rm -rf mkbootimg-src
        git clone --depth 1 https://github.com/neo-technologies/rockchip-mkbootimg.git mkbootimg-src
        make -C mkbootimg-src

        # ========================================================
        # 【修改点 F】给 boot.img 塞一个"救援 initramfs"（第七轮新增）
        #
        # 前六轮日志都停在同一个位置，且是同一个含义：
        #   mmcblk1: p1(rootfs)       /  b301 3846144 mmcblk1p1   ← 分区完全正确
        #   No filesystem could mount root, tried: ext4
        #   Kernel panic ... "/dev/mmcblk1p1" or unknown-block(179,1)
        # 设备节点存在、ext4 已内建，却读不到超级块。内核到此为止再没有任何
        # 能力告诉我们"eMMC 20MiB 那段里到底写着什么"。只能让内核先跑我们
        # 自己的 /init：
        #   1) 打印 /proc/partitions 和设备节点；
        #   2) 在多个候选偏移读 ext4 超级块（起始 +1024，magic 0x53EF）并打卷标；
        #   3) 把 20MiB 处前 64 字节原样 dump —— 全 00 = 没写；504b = 写成 zip；
        #      其它 = 别的东西，一眼定性；
        #   4) 找到 ext4 就挂载并 switch_root 继续正常启动（偏移不是 20MiB 也能起）。
        # 老 RK3188 loader 本来就必须支持 ramdisk（原厂 Android boot.img 就带），
        # ramdisk 地址对齐原厂的 0x62000000。
        # ========================================================
        sudo chroot "$GITHUB_WORKSPACE/usb_pure_rootfs" /bin/bash -c \
          'apt-get install -y --no-install-recommends busybox-static >/dev/null 2>&1 || true'
        if [ ! -f "$GITHUB_WORKSPACE/usb_pure_rootfs/bin/busybox" ]; then
          echo "❌ rootfs 里没有 /bin/busybox（busybox-static 装不上），无法生成救援 initramfs"
          exit 1
        fi

        IR="$GITHUB_WORKSPACE/rescue_initramfs"
        rm -rf "$IR"
        mkdir -p "$IR/bin" "$IR/proc" "$IR/sys" "$IR/dev" "$IR/newroot"
        sudo cp "$GITHUB_WORKSPACE/usb_pure_rootfs/bin/busybox" "$IR/bin/busybox"
        sudo chmod 755 "$IR/bin/busybox"
        sudo tee "$IR/init" > /dev/null <<'INIT_EOF'
        #!/bin/busybox sh
        /bin/busybox --install -s /bin 2>/dev/null
        export PATH=/bin:/sbin

        mount -t proc none /proc 2>/dev/null
        mount -t sysfs none /sys 2>/dev/null
        mount -t devtmpfs none /dev 2>/dev/null

        log() { echo "[rescue] $*"; }
        MB=1048576
        DISK=/dev/mmcblk1

        log "================ RK3188 救援 initramfs ================"
        log "这一段是 CI 打进 boot.img 的 /init，用来查 eMMC 里到底有什么"
        log "---- /proc/cmdline ----"
        cat /proc/cmdline
        log "---- /proc/partitions ----"
        cat /proc/partitions
        log "---- 设备节点 ----"
        ls -l /dev/mmcblk1 /dev/mmcblk1p1 2>/dev/null

        if [ ! -b "$DISK" ]; then
          log "❌ 没有 $DISK（MMC 驱动没起来，与 rootfs 无关）"
          exec sh
        fi

        # ext4 超级块固定在分区起始 +1024，magic 两字节在 +0x38
        magic_at() {
          dd if=$DISK bs=512 skip=$(( $1 / 512 + 2 )) count=1 2>/dev/null \
            | od -An -tx1 -N 58 | tr -s ' ' '\n' | grep -v '^$' | tail -2 | tr -d '\n'
        }
        label_at() {
          dd if=$DISK bs=8 skip=$(( ( $1 + 1144 ) / 8 )) count=2 2>/dev/null \
            | tr -d '\000' | tr -d '\n'
        }

        log "---- 候选偏移探测（ext4 超级块 magic 应为 53ef）----"
        # 【第九轮】ttl-rz9 的教训：光"有 ext4 超级块"不代表这份数据能用。
        # 盘上出现了两份 rootfs 头（24MiB 与 28MiB），24MiB 那份超级块还在，
        # 但它的日志区已被后一次写入覆盖，内核挂载时报：
        #   JBD2: no valid journal superblock found
        #   EXT4-fs (mmcblk1p1): Could not load journal inode
        #   mount: mounting /dev/mmcblk1p1 on /newroot failed: Invalid argument
        # 所以判定标准从"magic 是不是 53ef"改成"能不能真的挂上、里面有没有
        # /etc/os-release"——旧拷贝挂不上就自动跳过，选能用的那一份。
        CANDS=""
        for off in 29360128 25165824 20971520 33554432 41943040 16777216 8388608 67108864 134217728 268435456 0; do
          m=$(magic_at $off)
          if [ "$m" = "53ef" ]; then
            log "  $off 字节 (= $(( off / MB )) MiB) : ext4 超级块 ✅ 卷标=[$(label_at $off)]"
            CANDS="$CANDS $off"
          else
            log "  $off 字节 (= $(( off / MB )) MiB) : 无 ext4 超级块 (magic=$m)"
          fi
        done

        if [ -z "$CANDS" ]; then
          log "---- 候选都没命中，开始粗扫（1MiB 步长扫 4~128MiB，8MiB 步长扫到盘尾）----"
          off=4194304
          while [ $off -lt 134217728 ]; do
            if [ "$(magic_at $off)" = "53ef" ]; then
              log "  ✅ $off 字节 (= $(( off / MB )) MiB) 有 ext4，卷标=[$(label_at $off)]"
              CANDS="$CANDS $off"
            fi
            off=$(( off + 1048576 ))
          done
          off=134217728
          while [ $off -lt 3866624000 ]; do
            if [ "$(magic_at $off)" = "53ef" ]; then
              log "  ✅ $off 字节 (= $(( off / MB )) MiB) 有 ext4，卷标=[$(label_at $off)]"
              CANDS="$CANDS $off"
            fi
            off=$(( off + 8388608 ))
          done
          log "  粗扫结束"
        fi

        log "---- eMMC 20MiB 处原始前 64 字节（全 00=没写，504b=写成了zip，其它=旧数据）----"
        dd if=$DISK bs=512 skip=40960 count=1 2>/dev/null | od -An -tx1 -N 64

        if [ -z "$CANDS" ]; then
          log "❌ 所有候选偏移都没有 ext4 超级块 → rootfs.img 没有真正刷进 eMMC"
          log "   请把这段日志发出来；同时核对刷机工具里 rootfs 行的 勾选/文件/地址/耗时"
          exec sh
        fi

        # 一份 rootfs 算"能用"的条件：挂得上 + 里面有实体文件 os-release/systemd。
        # 注意不要用 /sbin/init 判断：Ubuntu 的 /sbin 是指向 /usr/sbin 的绝对软链，
        # 未 chroot 时内核按 initramfs 的 / 解析，必然找不到（第八轮的假报错）。
        has_rootfs() { [ -e /newroot/etc/os-release ] || [ -e /newroot/usr/lib/systemd/systemd ]; }

        P1_START_SECT=$(cat /sys/class/block/mmcblk1p1/start 2>/dev/null)
        log "  内核建出的 mmcblk1p1 起点 = ${P1_START_SECT:-?} 扇区"

        FOUND=""
        for off in $CANDS; do
          [ -n "$FOUND" ] && break
          umount /newroot 2>/dev/null
          losetup -d /dev/loop0 2>/dev/null
          log "---- 试挂 $off 字节 (= $(( off / MB )) MiB) ----"
          if [ "$P1_START_SECT" = "$(( off / 512 ))" ]; then
            log "  与 mmcblk1p1 起点一致，直接挂 /dev/mmcblk1p1"
            mount -t ext4 -o rw /dev/mmcblk1p1 /newroot
          else
            log "  与 p1 起点不一致（p1=$P1_START_SECT 扇区），用 losetup -o 挂"
            losetup -o $off /dev/loop0 $DISK 2>/dev/null
            mount -t ext4 -o rw /dev/loop0 /newroot
          fi
          if has_rootfs; then
            FOUND=$off
            log "  ✅ 挂载成功，且看到 /etc/os-release：$(head -1 /newroot/etc/os-release 2>/dev/null)"
            df -h /newroot 2>/dev/null | tail -2
          else
            log "  ❌ 这份挂不上/内容不对（很可能是被后一次写入覆盖过的旧拷贝），换下一个"
            umount /newroot 2>/dev/null
            losetup -d /dev/loop0 2>/dev/null
          fi
        done

        if [ -z "$FOUND" ]; then
          log "❌ 所有候选都挂不上 → eMMC 里没有一份完整可用的 rootfs"
          log "   对策：把 rootfs.img 整段重刷一次（只刷 Parameter/boot 不够），再跑"
          exec sh
        fi

        log "✅ 真正可用的 rootfs 在 $(( FOUND / MB )) MiB（$FOUND 字节）"

        log "✅ rootfs 已挂载，switch_root 到真实 /sbin/init"
        mount -t proc none /newroot/proc 2>/dev/null
        mount -t sysfs none /newroot/sys 2>/dev/null
        mount -t devtmpfs none /newroot/dev 2>/dev/null
        exec switch_root /newroot /sbin/init
        INIT_EOF
        sudo chmod 755 "$IR/init"

        # 【修改点 F2】不再依赖 cpio 命令
        # 上一轮 CI 就死在这一步：`gzip -dc ... | cpio -it | grep -qx './init'`
        # 报 "❌ initramfs 里没有 /init"，可归档明明有 868606 字节（内容是在的），
        # 是不同 cpio 版本下 `-t` 的列表输出/退出码形态不一致导致的误判。
        # 改为调用仓库里的 tools/mkinitramfs.py：自己写 newc 归档、自己回读校验，
        # 不依赖 runner 上装没装 cpio。
        MKI="$GITHUB_WORKSPACE/tools/mkinitramfs.py"
        [ -f "$MKI" ] || MKI="$GITHUB_WORKSPACE/mkinitramfs.py"
        [ -f "$MKI" ] || { echo "❌ 仓库里找不到 tools/mkinitramfs.py"; exit 1; }
        python3 "$MKI" --create "$IR" "$FINAL_DIR/initramfs.cpio.gz"
        echo "✅ initramfs.cpio.gz: $(stat -c%s "$FINAL_DIR/initramfs.cpio.gz") 字节"
        python3 "$MKI" --verify "$FINAL_DIR/initramfs.cpio.gz" /init /bin/busybox

        # 【第九轮·按教程改正主副角色】
        # 教程里的 boot.img 只有 kernel + dtb，**不带 ramdisk**；内核自己按
        # root=/dev/mmcblkXpX 挂上根文件系统，然后 "Run /sbin/init as init process"
        # —— 教程截图里的 Debian 11 就是这么起来的（EXT4-fs (mmcblk0p1) mounted）。
        # 我们有内核没挂上根时，就会停在内核里；而把 initramfs 塞进 boot.img 后，
        # 内核不挂根、全交给我们的 /init，一旦挂载失败就落到 BusyBox 的 "/ #"
        # 提示符（用户看到的"提示符不对、没有登录"正是这个）。所以：
        #   boot.img        = 纯内核（教程同款）= 主刷件
        #   boot-rescue.img = 带救援 initramfs = 只有出问题时才刷的诊断件
        ./mkbootimg-src/mkbootimg \
          --kernel zImage-dtb \
          --cmdline "$CMDLINE_BOOT" \
          -o "$FINAL_DIR/boot.img"
        echo "✅ boot.img（纯内核，教程同款，主刷）: $(stat -c%s "$FINAL_DIR/boot.img") 字节"

        ./mkbootimg-src/mkbootimg \
          --kernel zImage-dtb \
          --ramdisk "$FINAL_DIR/initramfs.cpio.gz" \
          --ramdiskaddr 0x62000000 \
          --cmdline "$CMDLINE_BOOT" \
          -o "$FINAL_DIR/boot-rescue.img"
        echo "✅ boot-rescue.img（含救援 initramfs，诊断用）: $(stat -c%s "$FINAL_DIR/boot-rescue.img") 字节"

        # ========================================================
        # 【修改点 D3】回读两个 boot 头做二次确认
        # 标准 Android boot image：magic "ANDROID!"，page_size 16384（RK3188）。
        # 第九轮起角色对调：boot.img 必须 ramdisk_size=0（教程路线），
        # boot-rescue.img 必须带 ramdisk 且 ramdisk_addr=0x62000000。
        # ========================================================
        python3 - "$FINAL_DIR/boot.img" "$FINAL_DIR/boot-rescue.img" << 'PY'
        import sys, struct
        for path, expect_ramdisk in ((sys.argv[1], False), (sys.argv[2], True)):
            with open(path, 'rb') as f:
                head = f.read(16384)
            assert head[:8] == b'ANDROID!', path + ' 头不是 ANDROID!（打包格式错误）'
            ksize, kaddr, rsize, raddr = struct.unpack('<4I', head[0x08:0x18])
            page = struct.unpack('<I', head[0x24:0x28])[0]
            cmd = head[0x40:0x40 + 512].split(b'\0')[0].decode('utf-8', 'replace')
            print('----', path.split('/')[-1], '----')
            print('  cmdline      :', cmd)
            print('  kernel_addr  : 0x%08x  kernel_size: %d' % (kaddr, ksize))
            print('  ramdisk_addr : 0x%08x  ramdisk_size: %d' % (raddr, rsize))
            print('  page_size    :', page)
            for token in ('blkdevparts=mmcblk1:', 'root=/dev/mmcblk1p1', 'console=ttyS2'):
                assert token in cmd, path + ' 头 cmdline 缺少: ' + token
            assert kaddr == 0x60408000, path + ' kernel_addr 应为 0x60408000'
            assert page == 16384, path + ' page_size 应为 16384'
            if expect_ramdisk:
                assert rsize > 0, 'boot-rescue.img 里没有 ramdisk（救援 init 没打进去）'
                assert raddr == 0x62000000, 'boot-rescue.img ramdisk_addr 应为 0x62000000'
            else:
                assert rsize == 0, 'boot.img 必须不带 ramdisk（教程路线：内核自己挂根）'
        print('✅ 两个 boot 镜像头校验通过（boot.img 纯内核，boot-rescue.img 带救援 ramdisk）')
        PY

        if [ -f "$GITHUB_WORKSPACE/inspect_rk_img.sh" ]; then
          chmod +x "$GITHUB_WORKSPACE/inspect_rk_img.sh"
          "$GITHUB_WORKSPACE/inspect_rk_img.sh" "$FINAL_DIR/boot.img" \
            | tee "$FINAL_DIR/boot-inspect.txt"
        fi

        cp "$GITHUB_WORKSPACE/parameter.txt" "$FINAL_DIR/parameter.txt"
        # 救援件配套参数（唯一差别：CMDLINE 保留 initrd=），只给 boot-rescue.img 用。
        # 仓库里有就用仓库的；没有就从 parameter.txt 现派生一份，保证 blkdevparts
        # 与主参数永远一致（避免两份文件各改各的）。
        if [ -f "$GITHUB_WORKSPACE/parameter-rescue.txt" ]; then
          cp "$GITHUB_WORKSPACE/parameter-rescue.txt" "$FINAL_DIR/parameter-rescue.txt"
          echo "✅ parameter-rescue.txt（取自仓库）"
        else
        python3 - "$GITHUB_WORKSPACE/parameter.txt" "$FINAL_DIR/parameter-rescue.txt" << 'PY'
        import sys
        src, dst = sys.argv[1], sys.argv[2]
        banner = [
            '# =====================================================================',
            '# parameter-rescue.txt —— 由 parameter.txt 自动派生（仓库未提供该文件）',
            '#',
            '# 唯一差别：CMDLINE 里保留 initrd=0x62000000,0x00800000。',
            '# RK31 loader 看到这一项才会把 boot.img 里的 ramdisk 搬到 0x62000000；',
            '# 只给 boot-rescue.img（带救援 initramfs）用。主刷 boot.img 是纯内核，',
            '# 带 initrd= 会让内核去解一段残留垃圾并跳过挂根（ttl-rz10 的 panic）。',
            '# =====================================================================',
        ]
        out = []
        for line in open(src, encoding='utf-8').read().splitlines():
            if line.startswith('CMDLINE:'):
                out.extend(banner)
                assert ' init=/sbin/init ' in line, 'parameter.txt 的 CMDLINE 里没有 init=/sbin/init'
                line = line.replace(' init=/sbin/init ',
                                    ' init=/sbin/init initrd=0x62000000,0x00800000 ', 1)
            out.append(line)
        open(dst, 'w', encoding='utf-8').write('\n'.join(out) + '\n')
        print('✅ parameter-rescue.txt（由 parameter.txt 自动派生）')
        PY
        python3 - "$FINAL_DIR/parameter-rescue.txt" << 'PY'
        import sys
        cm = [l for l in open(sys.argv[1], encoding='utf-8')
              if l.startswith('CMDLINE:')][0]
        assert 'initrd=0x62000000,' in cm, '派生失败：没有写进 initrd='
        assert 'blkdevparts=mmcblk1:' in cm, '派生失败：blkdevparts 丢了'
        print('  ✅ 派生结果校验通过：有 initrd=、有 blkdevparts')
        PY
        fi
        cp "$GITHUB_WORKSPACE/kernel.config" "$FINAL_DIR/kernel.config"

        # ========================================================
        # 【修改点 D4】删除 wipe-emmc.sh
        # 上一版让用户刷机前 dd 擦 eMMC 前 1MiB，理由写的是"擦掉旧 MBR 让 loader
        # 重建分区表"。两处都是错的：
        #   1) 前 1MiB 里是 loader 本体，擦掉可能直接让盒子进不了 loader；
        #   2) loader 从来不会按 mtdparts 写 MBR，分区表根本不存在（日志实证）。
        # 这个脚本只会制造风险，没有任何收益，整段删除。
        # ========================================================

        cat > "$FINAL_DIR/README.txt" << EOF
        设备: ${DEVICE_MODEL}  板型: ${BOARD}
        发行版: ${DISTRO} (${CODENAME})
        内核: ${KERNEL_VERSION}  架构: ${UBUNTU_ARCH}

        ========== 刷机步骤 ==========
        1. RKDevTool 用 "下载镜像" 页（Download Image），不是 "升级固件" 页。
           "升级固件" 吃的是单个 update.img，本包给的是分立的 4 个文件，
           在那个页面上你选了也不会真的把 rootfs.img 写进 eMMC。
           四行必须全部【打勾】，地址与文件严格对应：
             #1 Loader     0x00000000   loader.bin（原厂，本包未附带则用现有的）
             #2 Parameter  0x00000000   本目录的 parameter.txt
             #3 boot       0x00002000   本目录的 boot.img      （= 4 MiB，纯内核）
                                        （只有排查问题才换成 boot-rescue.img）
             #4 rootfs     0x0000C000   本目录的 rootfs.img    （工具实际写到 28 MiB）
        2. 点击 "执行"。rootfs.img 的大小 = max(内容×1.3, 输入 rootfs_size)，硬下限 1024MiB，
           rootfs 那一行会走 1~3 分钟；
           如果整个刷机几秒钟就结束，说明 rootfs 根本没写下去 —— 这就是
           第六轮 "No filesystem could mount root, tried: ext4" 的原因。
        3. 串口 ttyS2 / 115200 查看启动日志（本机 TTL 物理接 UART2）
        4. 【无需】再擦 eMMC 分区表：eMMC 本来就没有分区表，
           rootfs 分区由内核按 CMDLINE 的 blkdevparts 现场创建。

        ========== 刷机前先核对镜像指纹 ==========
          MANIFEST.sha256 里有 parameter.txt / parameter-rescue.txt / boot.img / boot-rescue.img / rootfs.img
          的 SHA256。rootfs.img 下载被截断 = 刷进去没有 ext4 超级块，症状和前几轮
          一模一样。
            Linux  : sha256sum -c MANIFEST.sha256
            Windows: certutil -hashfile rootfs.img SHA256

        ========== ★ 本轮：回到教程同款偏移，实现"存储对齐" ★ ==========
          教程日志里那两个 4.00 MiB 是 eMMC 的硬件 boot 分区：
              mmcblk0boot0: mmc0:0001 Biwin 4.00 MiB
              mmcblk0boot1: mmc0:0001 Biwin 4.00 MiB
          本机是 2.00 MiB（mmcblk1boot0/1）。它们和 rootfs 偏移无关，不用对齐。
          与偏移有关的 4MiB 是 parameter 里的 0x2000 扇区：加载器自家保留区，
          所以 boot 从 4MiB 起、长 16MiB、到 20MiB(0xA000) 结束。

          两轮实测（ttl-rz8 / ttl-rz9）得到固定规律：
              工具写盘位置 = parameter 里 rootfs 声明偏移 + 0x2000 扇区(4MiB)
              声明 0xA000(20MiB) → 落 24MiB（rz8：挂载成功，df 973.4M）
              声明 0xC000(24MiB) → 落 28MiB（rz9：从未挂载验证过，且把 24MiB
                                           那份的日志区碾坏 → JBD2 报错）
          既然 +4MiB 是死的，就不再追着它改声明，而是回到教程同款的 0xA000：

              boot      0x2000 .. 0xA000   （4MiB ~ 20MiB，16MiB 容量，紧接）
              rootfs    声明 0xA000(20MiB) → 工具 +4MiB → 实际落 24MiB
              blkdevparts @24M             → p1 起点 = 24MiB = 数据起点
              24MiB 是 4MiB 整数倍，对 eMMC 擦除块/页对齐友好

          本包三个文件因此同步（CI 按 "blkdevparts = mtdparts + 4MiB" 硬校验）：
              parameter.txt : blkdevparts=mmcblk1:-@24M(rootfs)
                              mtdparts=...,-@0x0000A000(rootfs)
              dts bootargs  : @24M，与 parameter 同步

        ========== ★ 本轮（ttl-rz10 之后）修的是 initrd= ★ ==========
          ttl-rz10 的日志：
              Kernel command line: ... initrd=0x62000000,0x00030000 ...
              Trying to unpack rootfs image as initramfs...
              Initramfs unpacking failed: junk within compressed archive
              Freeing initrd memory: 192K
              mmcblk1: p1(rootfs)                       ← 分区造对了
              Run /init as init process
              Failed to execute /init (error -2)
              Run /sbin/init as init process
              Kernel panic - not syncing: Requested init /sbin/init failed (error -2).
          逐句翻译：
            · 主刷的 boot.img 是纯内核、没有 ramdisk，但 CMDLINE 里还留着
              initrd=0x62000000,...，于是 loader 在 0x62000000 上交给内核一段
              192K 的**残留垃圾**（不是我们的 initramfs）；
            · 内核"以为"有早期用户态（initramfs），去解包 → "junk within
              compressed archive" 失败，然后**跳过了挂根那一步**；
            · 于是它直接 exec /init，而空 ramfs 里没有 /init（error -2 = ENOENT），
              再 exec /sbin/init，也没有 → panic。
          结论：**主刷 parameter 的 CMDLINE 里必须没有 initrd=**。
          本包已去掉；需要 initrd= 的场合（刷 boot-rescue.img）改用
          parameter-rescue.txt（与主参数的唯一差别就是保留了这一项）。
          注意：从头到尾**没有出现过 EXT4-fs 挂载行**，说明根分区压根没被尝试挂载
          ——不是 rootfs 数据坏了，是内核在挂根之前就 panic 了。

        ========== 这一次先只刷两行（10MB 级，最快）==========
          #2 Parameter  0x00000000   本包 parameter.txt（已去掉 initrd=）
          #3 boot       0x00002000   本包 boot.img（纯内核，教程同款）
          rootfs 这次先不刷：如果上一轮已按 4 行整段刷过 rootfs.img，24MiB 那份就是
          新写的；这次失败与它无关（内核根本没挂根）。刷完看日志：
              mmcblk1: p1(rootfs)
              EXT4-fs (mmcblk1p1): mounted filesystem ...   ← 这一行才是关键
              Run /sbin/init as init process
          若 24MiB 那份报 EXT4/JBD2 错误，再整段刷一次 rootfs（约 1GiB，1~3 分钟）。

        ========== 为什么这一版把 initramfs 从 boot.img 里拿掉了 ==========
          教程的 boot.img 只有 kernel + dtb，没有 ramdisk：
              mkbootimg --kernel ../3188/kernel-dtb -o ../3188/boot.img
          它的 TTL 日志是：
              EXT4-fs (mmcblk0p1): mounted filesystem
              Run /sbin/init as init process
              Welcome to Debian GNU/Linux 11 (bullseye)!
          也就是**内核自己挂根、自己 exec /sbin/init**，中间没有我们的脚本。
          前几轮把救援 initramfs 塞进 boot.img 后，内核就不再自己挂根了，
          全部交给我们那个 /init：挂得上才 switch_root，挂不上就落到 BusyBox 的
          "/ #"（"sh: can't access tty" 就是它）—— 你看到的"提示符不对、
          没有登录提示、没有密码输入"就是这么来的，不是系统登录被关了。
          所以本包：
              boot.img        = 纯内核（教程路线，主刷件）
              boot-rescue.img = 带救援 initramfs（只在需要拍照取证时才刷）

        ========== 救援 init 会打印什么（刷 boot-rescue.img + parameter-rescue.txt）==========
            - /proc/cmdline（核对 initrd= 有没有真的传进来）
            - 候选偏移逐个报告有没有 ext4 超级块（24MiB / 20MiB / 28MiB / 32MiB / 40MiB ...）
            - 候选不中时自动粗扫：1MiB 步长扫 4~128MiB，8MiB 步长扫到盘尾
            - 打印 eMMC 20MiB 处原始前 64 字节
              · 全是 00           → rootfs.img 根本没写进去
              · 开头是 504b 0304  → rootfs 那行选的文件其实是 zip，选错文件了
              · 开头是 53ef ...   → 数据在，是偏移/分区起点对不上
          只有"挂得上并且里面有 /etc/os-release"才认，接着 switch_root 进系统；
          挂不上的（旧拷贝）自动跳过换下一份 —— 这就是本轮的关键修正。

          ⚠️ boot-rescue.img 只是诊断件。正常启动**不要**刷它：
             有 initramfs 时内核不挂根，全靠 /init；挂不上你就只能看到 / #。
             什么时候才刷它：boot.img 报 "No filesystem could mount root, tried: ext4"
             或 "VFS: Cannot open root device"，需要知道 eMMC 里到底哪一段有 ext4 时。

        ========== 验证成功标志（按顺序出现）==========
          Kernel command line: ... blkdevparts=mmcblk1:-@24M(rootfs) ...（且没有 initrd=）
          mmcblk1: p1(rootfs)
          （不应再出现 "Trying to unpack rootfs image as initramfs"）
          EXT4-fs (mmcblk1p1): mounted filesystem with ordered data mode
          Run /sbin/init as init process      ← 教程日志也是这一行
          （随后是 systemd 启动日志，串口出现 "Ubuntu 22.04 ... login:"。
            看到 login: 才算进系统；停在 [rescue] 之后的 / # 是 BusyBox 救援 shell，
            不是系统提示符，也没有登录和密码）

        ========== 若仍失败的快速定位 ==========
          A. 日志里 Kernel command line 不含 blkdevparts
             → 刷机工具那行 Parameter 没换成本目录文件，重刷。
          B. 日志里有 blkdevparts 但没有 "mmcblk1: p1"
             → 打开本包 kernel.config，确认 CONFIG_CMDLINE_PARTITION=y；
               这一版 CI 已强制校验，正常不会缺。
          C. 有 p1、但报 "No filesystem could mount root, tried: ext4"
             → 分区起点和真实数据错开了。先刷 boot-rescue.img 跑一次，
               看它"候选偏移探测 + 试挂"那一行：哪个偏移报"挂载成功"，
               就把 parameter.txt 的 blkdevparts 改成那个 @NN M（mtdparts 保持
               比它小 4MiB），重刷 Parameter + boot.img + rootfs 即可。
          D. 有 p1、且能看到 EXT4-fs，但卡在 init
             → 才轮到 rootfs 内部（systemd/getty）问题，届时再发日志。

        ========== 账号 ==========
        root 密码: ${ROOT_PASSWORD}
        EOF

        # ========================================================
        # 【修改点 E2】产物指纹清单
        # rootfs.img 约 1GiB，下载过程一旦被截断，刷进去就是“没有 ext4 超级块”
        # 这种最费时间的假故障。这里生成 MANIFEST.sha256，刷机前先核对：
        #   Windows: certutil -hashfile rootfs.img SHA256
        #   Linux  : sha256sum -c MANIFEST.sha256
        # 指纹一致 → 镜像没坏，问题一定在“刷机时 rootfs 那行有没有真的写下去”。
        # ========================================================
        ( cd "$FINAL_DIR" && sha256sum parameter.txt parameter-rescue.txt boot.img boot-rescue.img rootfs.img > MANIFEST.sha256 \
          && echo "---- MANIFEST.sha256 ----" && cat MANIFEST.sha256 )

        ZIP_NAME="${FINAL_DIR}.zip"
        cd "$FINAL_DIR"
        zip -q -r "../${ZIP_NAME}" .
        cd ..
        echo "ZIP_NAME=${ZIP_NAME}" >> "$GITHUB_ENV"

    # ============================================================
    # 步骤 8：上传 Release
    # ============================================================
    - name: 8. 上传到 Releases
      uses: softprops/action-gh-release@v2
      with:
        tag_name: build-${{ github.run_number }}-${{ matrix.distro }}-${{ matrix.codename }}
        name: "RK3188 ${{ matrix.distro }} ${{ matrix.codename }} (Kernel ${{ inputs.kernel_version }}) - ${{ inputs.board }}"
        files: |
          ${{ env.ZIP_NAME }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
